<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo – Phiếu đề nghị xuất kho (Thành An)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
/* ===== Base (mô phỏng theme Velzon + V2Base của hrm-thanhan-client) ===== */
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Poppins,sans-serif;font-size:13px;color:#212529;background:#f3f3f9;padding:0 0 66px}
a{color:#28539d;text-decoration:none}
.page{padding:12px 16px 20px}
.muted{color:#6e7580}.small{font-size:11.5px}.bold{font-weight:600}
.text-right{text-align:right}.text-center{text-align:center}
.nowrap{white-space:nowrap}
.d-flex{display:flex}.ai-c{align-items:center}.gap6{gap:6px}.gap8{gap:8px}.ml-auto{margin-left:auto}

/* ===== Demo bar (chỉ có trong demo) ===== */
#bar{position:sticky;top:0;z-index:900;background:#0f172a;color:#e2e8f0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:6px 16px;font-size:12px}
#bar b{color:#5eead4;font-weight:600}
#bar select{height:26px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#e2e8f0;font:inherit;padding:0 6px}
#bar .sep{width:1px;height:18px;background:#334155}
#bar .note{color:#94a3b8}

/* ===== PageHeader ===== */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ph h4{margin:0;font-size:15px;font-weight:700;color:#1f2937;text-transform:uppercase;letter-spacing:.2px}
.ph .bc{font-size:12px;color:#6e7580}
.ph .bc a{color:#6e7580}.ph .bc a:hover{color:#1abc9c}
.ph .bc i{font-size:11px;margin:0 4px}

/* ===== Card ===== */
.tp-card{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(56,65,74,.15);margin-bottom:12px}
.sec{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(56,65,74,.15);margin-bottom:12px}
.sec-h{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e7eb;padding:10px}
.sec-h h6{margin:0;font-size:14px;font-weight:700;color:#1f2937}
.sec-b{padding:10px}

/* ===== Button V2Button ===== */
.vb{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 8px;font:600 12px Poppins,sans-serif;border-radius:8px;border:1px solid transparent;cursor:pointer;white-space:nowrap;transition:.15s;background:#fff}
.vb i{font-size:15px;line-height:1}
.vb.primary{background:#1abc9c;color:#fff;border-color:#1abc9c}.vb.primary:hover{background:#2dd4bf;border-color:#2dd4bf}
.vb.primary-danger{background:#dc2626;color:#fff;border-color:#dc2626}.vb.primary-danger:hover{background:#ef4444}
.vb.primary-warning{background:#d97706;color:#fff;border-color:#d97706}.vb.primary-warning:hover{background:#f59e0b}
.vb.secondary{background:#fff;color:#333;border-color:#cbd5e1}.vb.secondary:hover{background:#f8fafc}
.vb.secondary-success{background:#f7fee7;color:#15803d;border-color:#86efac}.vb.secondary-success:hover{background:#ecfccb}
.vb.secondary-warning{background:#fffbeb;color:#b45309;border-color:#fcd34d}.vb.secondary-warning:hover{background:#fef3c7}
.vb.secondary-danger{background:#fef2f2;color:#dc2626;border-color:#fecaca}.vb.secondary-danger:hover{background:#fee2e2}
.vb.tertiary{background:#fff;color:#1f2937;border-color:#e2e8f0}.vb.tertiary:hover{background:#f8fafc}
.vb:disabled,.vb.disabled{background:#f1f5f9!important;color:#94a3b8!important;border-color:#e2e8f0!important;cursor:not-allowed}
.vb.sm{height:26px;font-size:11.5px;padding:0 7px}
/* nút icon cột Thao tác */
.ib{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#334155;cursor:pointer;font-size:15px;padding:0}
.ib:hover{background:#f1f5f9}
.ib.danger{border-color:#fecaca;color:#dc2626;background:#fef2f2}.ib.danger:hover{background:#fee2e2}
.ib:disabled{opacity:.45;cursor:not-allowed}
.act{display:inline-flex;gap:4px;position:relative}
.menu{position:absolute;right:0;top:34px;min-width:172px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:4px;z-index:60;text-align:left}
.menu a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:#1f2937;font-size:12.5px;cursor:pointer}
.menu a:hover{background:#f1f5f9}.menu a i{font-size:15px;color:#64748b}

/* ===== Smart filter ===== */
.sf{padding:10px 16px}
.sf-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sf-ic{width:26px;height:26px;border-radius:50%;background:rgba(22,163,74,.1);color:#16a34a;display:flex;align-items:center;justify-content:center;font-size:14px}
.sf-t{font-size:.8rem;font-weight:600;color:#1f2937}
.sf-h .r{margin-left:auto;display:flex;gap:6px}
.qs{position:relative}
.qs i.ri-search-line{position:absolute;left:10px;top:8px;color:#94a3b8;font-size:15px}
.qs input{width:100%;height:32px;border:1px solid #dcdfe6;border-radius:6px;padding:0 30px 0 32px;font:13px Poppins,sans-serif;outline:none}
.qs input:hover{border-color:#b8bec9}.qs input:focus{border-color:#1976d2}
.qs .clr{position:absolute;right:8px;top:7px;color:#94a3b8;cursor:pointer;font-size:15px}
.adv{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px;margin-top:12px}
.adv-f{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}

/* ===== Floating field (V2FloatingField) ===== */
.ff{position:relative;height:32px;border:1px solid #dcdfe6;border-radius:6px;background:#fff;transition:border-color .15s}
.ff:hover{border-color:#b8bec9}.ff.focus{border-color:#1976d2}
.ff label{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#6e7580;pointer-events:none;transition:.15s;background:transparent;padding:0 3px;white-space:nowrap;max-width:calc(100% - 30px);overflow:hidden;text-overflow:ellipsis}
.ff.is-float label{top:0;font-size:11px;font-weight:600;color:#5c636e;background:#fff}
.ff input,.ff select{width:100%;height:100%;border:0;outline:none;background:transparent;font:13px Poppins,sans-serif;padding:0 26px 0 12px;color:#1f2937;border-radius:6px;appearance:none;-webkit-appearance:none}
.ff select{cursor:pointer}
.ff select:invalid{color:transparent}
.ff .caret{position:absolute;right:8px;top:7px;color:#94a3b8;pointer-events:none;font-size:15px}
.ff .x{position:absolute;right:24px;top:7px;color:#94a3b8;cursor:pointer;font-size:14px;display:none}
.ff.has-v .x{display:block}
.ff.range{display:flex;align-items:center}
.ff.range input{padding:0 6px 0 12px}
.ff.range .arr{color:#94a3b8;font-size:12px;padding:0 2px}
.ff.range input[type=date]{color:#1f2937}
.ff.range:not(.is-float) input[type=date]{color:transparent}

/* ===== Data table (MISA) ===== */
.tw{background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(56,65,74,.15);padding:8px 10px 10px}
.tw-h{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tw-h .cnt{font-size:12px;color:#6e7580}
.topscroll{overflow-x:auto;overflow-y:hidden;height:12px}
.topscroll div{height:1px}
.tscroll{overflow:auto;border:1px solid #ced1d6;border-radius:6px;max-height:calc(100vh - 330px);min-height:180px}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
table.dt th{position:sticky;top:0;z-index:3;background:#d8e7e1;color:#10141b;font-weight:700;padding:6px 8px;border-bottom:2px solid #7cc7ae;border-right:1px solid #ced1d6;text-align:center;white-space:nowrap}
table.dt td{padding:6px 8px;border-bottom:1px solid #ced1d6;border-right:1px dotted #ced1d6;background:#fbfbfc;vertical-align:middle}
table.dt tr:hover td{background:#e6f5ef}
table.dt tr.on td{background:#ddf1e9}
table.dt .stk{position:sticky;left:0;z-index:2}
table.dt th.stk{z-index:4}
table.dt .stk2{position:sticky;left:60px;z-index:2;box-shadow:4px 0 6px -3px rgba(15,23,42,.15)}
table.dt th.stk2{z-index:4}
.code{color:#28539d;font-weight:600;border-bottom:1px dashed #28539d;cursor:pointer}
.code:hover{color:#1d3f7a}
.empty{text-align:center;color:#9ca3af;font-style:italic;padding:28px!important}
.pager{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:#475569}
.pager .pg{display:flex;gap:4px;align-items:center}
.pager button{min-width:28px;height:28px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;cursor:pointer;font:12px Poppins}
.pager button.on{background:#1abc9c;border-color:#1abc9c;color:#fff}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager select{height:28px;border:1px solid #e2e8f0;border-radius:6px;font:12px Poppins}

/* ===== Badge ===== */
.bdg{display:inline-flex;align-items:center;padding:6px 10px;font-size:12px;font-weight:600;border-radius:999px;border:1px solid;white-space:nowrap;line-height:1}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10.5px;font-weight:600;border:1px solid;white-space:nowrap}
.chip.ton{color:#047857;background:#ecfdf5;border-color:#a7f3d0}
.chip.mua{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.chip.xvay{color:#7c3aed;background:#f5f3ff;border-color:#ddd6fe}
.chip.tgui{color:#b45309;background:#fffbeb;border-color:#fde68a}
.chip.ncc{color:#475569;background:#f1f5f9;border-color:#cbd5e1}
.swap-chip{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:4px;border:1px solid #eed9a8;background:#fbf4e4;color:#9a6f12;font-size:10px;font-weight:700;letter-spacing:.3px}

/* ===== Form ===== */
.row{display:flex;flex-wrap:wrap;margin:0 -6px}
.col-3{width:25%;padding:0 6px;margin-bottom:10px}
.col-4{width:33.333%;padding:0 6px;margin-bottom:10px}
.col-6{width:50%;padding:0 6px;margin-bottom:10px}
.col-8{width:66.666%;padding:0 6px;margin-bottom:10px}
.col-12{width:100%;padding:0 6px;margin-bottom:10px}
.lbl{display:block;font-size:12px;font-weight:600;color:#0f172a;margin-bottom:4px}
.req{color:#dc2626;margin-left:2px}
.fc{width:100%;height:32px;border:1px solid #dcdfe6;border-radius:6px;padding:0 10px;font:13px Poppins,sans-serif;color:#1f2937;background:#fff;outline:none}
.fc:hover{border-color:#b8bec9}.fc:focus{border-color:#1976d2}
textarea.fc{height:auto;min-height:56px;padding:6px 10px;resize:vertical}
.fc.is-invalid{border-color:#dc3545}
.fc:disabled,.fc.locked{background:#f1f5f9;color:#475569;border-color:#e2e8f0;cursor:default}
.selw{position:relative}
.selw select.fc{appearance:none;-webkit-appearance:none;padding-right:28px;cursor:pointer}
.selw select.fc:invalid{color:#9ca3af}
.selw .caret{position:absolute;right:8px;top:8px;color:#94a3b8;pointer-events:none;font-size:15px}
.selw .lk{position:absolute;right:8px;top:8px;color:#94a3b8;font-size:13px}
.pick{position:relative;cursor:pointer}
.pick .fc{cursor:pointer;padding-right:30px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pick .fc .ph{color:#9ca3af}
.pick i{position:absolute;right:9px;top:8px;color:#64748b;font-size:15px}
.err{display:flex;align-items:center;gap:3px;font-size:12px;color:#dc3545;font-weight:500;margin-top:3px}
.err.warn{color:#d97706}
.hint{font-size:11.5px;color:#6e7580;margin-top:3px}
.linkf{position:relative}
.linkf .fc{color:transparent}
.linkf a{position:absolute;left:11px;top:7px;font-weight:600;border-bottom:1px dashed #28539d;max-width:calc(100% - 20px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* ===== Form table ===== */
.ftw{border:1px solid #ced1d6;border-radius:6px;overflow:auto;max-height:520px}
table.ft{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.ft th{position:sticky;top:0;z-index:3;background:#d8e7e1;color:#10141b;font-weight:700;padding:5px 8px;border-bottom:2px solid #7cc7ae;border-right:1px solid #ced1d6;text-align:center;white-space:nowrap}
table.ft td{padding:5px 8px;border-bottom:1px solid #ced1d6;border-right:1px dotted #ced1d6;background:#fbfbfc;vertical-align:top}
table.ft.dense th{padding:3px 6px;font-size:12px}
table.ft.dense td{padding:3px 6px;font-size:12px}
table.ft .fz{position:sticky;z-index:2}
table.ft th.fz{z-index:4}
table.ft .fz-last{box-shadow:4px 0 6px -3px rgba(15,23,42,.15)}
table.ft tr.is-active td{background:#ddf1e9}
table.ft tr.is-warn td{background:#fffbeb}
table.ft tr.is-off td{color:#94a3b8}
table.ft tr.swap td{background:#fbf4e4;border-top:1px dashed #eed9a8}
table.ft tr.swap td:first-child{box-shadow:inset 3px 0 0 #d99e2b}
table.ft tr.swap.is-active td{background:#f6ead0}
table.ft tr.row-after td{background:#fdf8ec;padding-top:2px;padding-bottom:4px;font-size:11.5px;color:#7c5a10}
table.ft tr.row-after td:first-child{box-shadow:inset 3px 0 0 #d99e2b}
table.ft tr.flash td{animation:flash 1.2s}
@keyframes flash{0%,60%{background:#fee2e2}}
table.ft tfoot td{background:#f1f5f9;font-weight:700;position:sticky;bottom:0;z-index:2;border-top:2px solid #cbd5e1}
.xs{height:26px;width:100%;min-width:80px;border:1px solid #dcdfe6;border-radius:5px;padding:0 6px;font:12.5px Poppins,sans-serif;text-align:right;outline:none;background:#fff}
.xs:focus{border-color:#1976d2}.xs.is-invalid{border-color:#dc3545}.xs.is-warn{border-color:#f59e0b}
.xs:disabled{background:#f1f5f9;color:#94a3b8;border-color:#e2e8f0}
.xs.txt{text-align:left;min-width:120px}
.ft .err{font-size:11px;margin-top:2px;white-space:nowrap}
.cb{width:15px;height:15px;cursor:pointer;accent-color:#1abc9c;vertical-align:middle}
.tip{border-bottom:1px dotted #64748b;cursor:help}

/* ===== Box tổng / công nợ ===== */
.boxes{display:flex;gap:12px;margin-top:10px;align-items:flex-start;flex-wrap:wrap}
.note-ncc{flex:1;min-width:260px;font-size:12px;color:#475569;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:6px;padding:8px 10px}
.sumbox{min-width:300px;border:1px solid #e2e8f0;border-radius:6px;padding:8px 12px;background:#fff}
.sumbox .r{display:flex;justify-content:space-between;gap:20px;padding:3px 0;font-size:12.5px}
.sumbox .r.t{border-top:1px solid #e2e8f0;margin-top:3px;padding-top:6px;font-weight:700;font-size:13.5px;color:#0f766e}
.debt{min-width:330px;border:1px solid;border-radius:6px;padding:8px 12px;font-size:12.5px}
.debt.ok{border-color:#a7f3d0;background:#f0fdf4}
.debt.approve{border-color:#fde68a;background:#fffbeb}
.debt.block{border-color:#fecaca;background:#fef2f2}
.debt .h{display:flex;align-items:center;gap:6px;font-weight:700;margin-bottom:4px}
.debt.ok .h{color:#15803d}.debt.approve .h{color:#b45309}.debt.block .h{color:#dc2626}
.debt .r{display:flex;justify-content:space-between;gap:16px;padding:2px 0}

/* ===== Status banner / tabs / timeline ===== */
.banner{display:flex;align-items:flex-start;gap:10px;border-radius:8px;padding:10px 12px;margin-bottom:12px;border:1px solid;font-size:12.5px}
.banner i{font-size:18px;line-height:1.1}
.tabs{display:flex;gap:2px;border-bottom:1px solid #e5e7eb;padding:0 10px}
.tabs a{padding:9px 14px;font-size:13px;font-weight:600;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;display:flex;gap:6px;align-items:center}
.tabs a.on{color:#0f766e;border-bottom-color:#1abc9c}
.tabs .n{background:#e2e8f0;color:#334155;border-radius:999px;font-size:10.5px;padding:1px 6px}
.tl{list-style:none;margin:0;padding:4px 0 0 4px}
.tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid #e2e8f0;margin-left:6px}
.tl li:last-child{border-left-color:transparent}
.tl li:before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--c,#1abc9c)}
.tl .t{font-weight:600;font-size:12.5px}.tl .m{font-size:11.5px;color:#6e7580}
.tl .rs{margin-top:4px;background:#f8fafc;border-left:3px solid var(--c);padding:5px 8px;font-size:12px;border-radius:0 6px 6px 0}

/* ===== Modal V2BaseModal ===== */
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.mdl{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(15,23,42,.3);width:520px;max-width:100%;display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.mdl.sm{width:420px}.mdl.lg{width:820px}
.mdl.xl{width:98vw;height:98vh;max-height:98vh}
.mback.xlb{padding:1vh 1vw;align-items:center}
.m-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #e5e7eb}
.m-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(26,188,156,.12);color:#0f766e;flex:none}
.m-ic.danger{background:rgba(220,38,38,.1);color:#dc2626}
.m-ic.warn{background:rgba(217,119,6,.12);color:#d97706}
.m-t{font-size:14px;font-weight:700;color:#1f2937;flex:1}
.m-x{border:0;background:transparent;font-size:20px;color:#64748b;cursor:pointer;line-height:1}
.m-b{padding:.5rem .75rem;overflow:auto;flex:1}
.mdl.xl .m-b{display:flex;flex-direction:column;overflow:hidden}
.mdl.xl .m-b .ftw{flex:1;max-height:none}
.m-f{position:sticky;bottom:0;display:flex;justify-content:flex-end;gap:6px;padding:8px 12px;border-top:1px solid #e5e7eb;background:#fff;border-radius:0 0 10px 10px}
.m-f .l{margin-right:auto;display:flex;align-items:center;font-size:12px;color:#6e7580}
.cfm{font-size:13px;line-height:1.55;padding:6px 2px}
.pick-row{cursor:pointer}
.colcfg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.colcfg label{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 6px;border-radius:6px;cursor:pointer}
.colcfg label:hover{background:#f1f5f9}

/* ===== Chọn lô/serial ===== */
.ser{display:flex;flex-wrap:wrap;gap:4px}
.ser span{border:1px solid #cbd5e1;border-radius:5px;padding:1px 7px;font-size:11.5px;cursor:pointer;background:#fff}
.ser span.on{border-color:#1abc9c;background:#ecfdf5;color:#047857;font-weight:600}
tr.grp td{background:#eef2f7!important;font-weight:600}

/* ===== V2Footer ===== */
#footer{position:fixed;left:0;right:0;bottom:0;height:50px;background:rgba(255,255,255,.5);backdrop-filter:blur(4px);border-top:1px solid #e2e5e8;box-shadow:0 .75rem 6rem rgba(56,65,74,.4);display:flex;align-items:center;justify-content:flex-end;gap:5px;padding:0 16px;z-index:800}
#footer:empty{display:none}

/* ===== Toast ===== */
#toasts{position:fixed;top:44px;right:16px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{min-width:280px;max-width:420px;background:#fff;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);border-left:4px solid #1abc9c;padding:10px 12px;display:flex;gap:8px;font-size:12.5px;animation:tin .2s}
.toast.error{border-left-color:#dc2626}.toast.warn{border-left-color:#d97706}
.toast i{font-size:17px;color:#1abc9c}.toast.error i{color:#dc2626}.toast.warn i{color:#d97706}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="app" class="page"></div>
<div id="footer"></div>
<div id="modals"></div>
<div id="toasts"></div>
<script>
'use strict';

function parseQty(v) {
  v = String(v == null ? '' : v).trim().replace(/\s/g, '');
  if (v === '') return null;
  if (/^\d{1,3}(\.\d{3})+$/.test(v)) return Number(v.replace(/\./g, ''));
  if (/^\d+([.,]\d+)?$/.test(v)) return Number(v.replace(',', '.'));
  return NaN;
}

/* ===== Logic dòng hàng theo chứng từ nguồn =====
   - Bỏ dòng NCC giao thẳng (không qua kho → không có ĐNXK)
   - Dòng gốc có đổi hàng: SL kế hoạch = SL PXL − Σ SL gốc được thay (chỉ hiện nếu > 0)
   - Mỗi hàng thay thế = 1 dòng riêng, đơn giá & giá trị theo hàng GỐC × SL gốc được thay
   - Phiếu không hiện nguồn: các dòng thường cùng mã hàng + đơn giá (vd Kho sẵn + Mua về) GỘP thành 1 dòng,
     rid = id dòng đầu tiên; cap = Σ SL còn lại HĐ của từng phần. Không chặn theo phần mua đã về —
     ràng buộc thực tế là Tồn xuất được tại kho (user: phiếu chỉ lấy hàng đã có ở kho) */
function capOf(opt, plan) { return plan; }
function buildRows(src, type) {
  const s = SRC[src]; if (!s) return [];
  const opts = TYPE_OPTS[type] || [];
  const rows = [];
  s.lines.forEach(l => {
    if (l.opt === 'ncc') return;
    const repSum = (l.swaps || []).reduce((a, w) => a + w.rep, 0);
    const base = l.qty - repSum;
    if (base > 0 && opts.includes(l.opt)) {
      const same = rows.find(r => !r.swap && r.p === l.p && r.price === l.price);
      if (same) { same.plan += base; same.cap += capOf(l.opt, base, l.recv); same.parts.push(l.id); }
      else rows.push({ rid: l.id, pxl: l.pxl, p: l.p, opt: l.opt, plan: base, cap: capOf(l.opt, base, l.recv), recv: l.recv, price: l.price, parts: [l.id] });
    }
    (l.swaps || []).forEach(w => {
      if (!opts.includes(w.opt)) return;
      rows.push({ rid: w.id, pxl: l.pxl, p: w.p, opt: w.opt, plan: w.qty, cap: capOf(w.opt, w.qty, w.recv), recv: w.recv, price: l.price, parts: [w.id], swap: { p: l.p, rep: w.rep, orig: l.id } });
    });
  });
  return rows;
}
function nccLines(src) { const s = SRC[src]; return s ? s.lines.filter(l => l.opt === 'ncc') : []; }
function rowOf(src, rid) {
  const s = SRC[src]; if (!s) return null;
  for (const l of s.lines) {
    if (l.id === rid) { const repSum = (l.swaps || []).reduce((a, w) => a + w.rep, 0); return { rid, pxl: l.pxl, p: l.p, opt: l.opt, plan: l.qty - repSum, recv: l.recv, price: l.price }; }
    for (const w of (l.swaps || [])) if (w.id === rid) return { rid, pxl: l.pxl, p: w.p, opt: w.opt, plan: w.qty, recv: w.recv, price: l.price, swap: { p: l.p, rep: w.rep, orig: l.id } };
  }
  return null;
}
/* Đã đề nghị: mọi phiếu chưa hủy (kể cả nháp); phiếu đã đóng (st 5) tính theo SL thực xuất */
function reqd(src, rid, exId) {
  let q = 0, r = 0, e = 0;
  S.reqs.forEach(x => {
    if (x.status === 7 || x.id === exId || x.src !== src) return;
    x.lines.forEach(l => {
      if (l.rid !== rid) return;
      const closed = x.status === 5;
      e += l.exported || 0;
      q += closed ? l.exported : (l.qty || 0);
      r += closed ? l.exportedRep : (l.rep || 0);
    });
  });
  return { q, r, e };   /* q = đã xuất (e) + chờ xuất (q − e) */
}
function remainOf(src, row, exId) {

/* Tồn xuất được của 1 mã hàng tại 1 kho cho 1 KH:

function pendingMap(p, wh, exId) {
  const m = {};
  S.reqs.forEach(x => {
    if (x.status === 7 || x.status === 5 || x.id === exId || x.wh !== wh) return;
    const kh = x.src;   /* gom theo HĐ */
    x.lines.forEach(l => {
      const row = rowOf(x.src, l.rid);
      if (!row || row.p !== p) return;
      m[kh] = (m[kh] || 0) + Math.max(0, (l.qty || 0) - l.exported);

  return m;
}
function stockInfo(p, wh, kh, exId) {   /* kh = id HĐ (chứng từ nguồn) */
  const lots = S.lots.filter(l => l.p === p && l.wh === wh);
  const chung = lots.filter(l => !l.held).reduce((a, l) => a + l.qty, 0);
  const heldOf = k => lots.filter(l => l.held === k).reduce((a, l) => a + l.qty, 0);
  const pend = pendingMap(p, wh, exId);
  let other = 0;
  Object.keys(pend).forEach(k => { if (k !== kh) other += Math.max(0, pend[k] - heldOf(k)); });
  const held = heldOf(kh), mine = pend[kh] || 0;
  return { chung, held, mine, other, avail: Math.max(0, chung + held - mine - other) };
}

    case 'approve': return u.r === 'bgd' && st === 2;

/* =====================================================================

let EX = null;
function exLots(x, row) {

      if (q === null || q === 0) return;
      if (isNaN(q) || q < 0) errs[k] = 'SL phải là số lớn hơn 0';
      else if (P[it.row.p].serial && !Number.isInteger(q)) errs[k] = 'SL phải là số nguyên';
      else if (q > z.qty) errs[k] = 'Vượt tồn lô (' + fmt(z.qty) + ')';
      if (!isNaN(q) && q > 0) { sum += q; any++; }

    if (sum > it.left) errs[it.l.rid] = 'Tổng SL xuất vượt SL còn phải xuất (' + fmt(it.left) + ')';

        '<td>' + (z.serials ? '<div class="ser">' + z.serials.map(sn => '<span data-sn="' + k + '|' + sn + '" class="' + ((cell.ser || []).includes(sn) ? 'on' : '') + '">' + sn + '</span>').join('') + '</div>' : '') + '</td>' +

    });
    if (it.row.swap) {
      it.l.exportedRep = it.l.exported >= it.l.qty ? it.l.rep : Math.round(it.l.rep * it.l.exported / it.l.qty * 1000) / 1000;
    }
  });
  x.pxks.push({ code, at: nowDT(), by: S.user, items });
  const ex = x.lines.reduce((a, l) => a + l.exported, 0), tot = x.lines.reduce((a, l) => a + (l.qty || 0), 0);
  x.status = ex >= tot ? 5 : 4;
  log(x, 'Xuất kho ' + code + (x.status === 5 ? ' — đủ SL' : ' — một phần (' + fmt(ex) + '/' + fmt(tot) + ')'), x.status === 5 ? '#16A34A' : '#2563EB');
  toast('Đã tạo phiếu xuất kho ' + code + '.');
  DT.tab = 'pxk'; renderDetail();
}

/* =====================================================================
   THANH DEMO + ĐIỀU HƯỚNG
   ===================================================================== */
function renderBar() {
  $('#bar').innerHTML = '<b><i class="ri-flask-line"></i> DEMO</b><span>Đăng nhập:</span><select id="barUser">' +
    Object.keys(USERS).map(k => '<option value="' + k + '"' + (S.user === k ? ' selected' : '') + '>' + USERS[k].n + ' — ' + USERS[k].d + '</option>').join('') + '</select>' +
    (DEBT_ON ? '<span class="sep"></span><span>Công nợ KH:</span><select id="barDebt">' +
    [['ok', 'Trong hạn mức'], ['approve', 'Sát hạn mức (cần BGĐ duyệt)'], ['block', 'Có nợ quá hạn (chặn)']].map(o => '<option value="' + o[0] + '"' + (S.debt === o[0] ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select>' : '') +
    '<span class="sep"></span><span class="note">Hôm nay: ' + fmtD(TODAY) + ' · Dữ liệu chỉ lưu trong trang, tải lại sẽ về ban đầu</span>';
  $('#barUser').addEventListener('change', e => { S.user = e.target.value; LS.menu = null; if (S.view === 'form') go(F.id ? 'detail' : 'list', F.id); else go(S.view, S.id); });
  if (DEBT_ON) $('#barDebt').addEventListener('change', e => { S.debt = e.target.value; if (S.view === 'form') sync(); });
}
function go(view, id) {
  $('#modals').innerHTML = '';
  S.view = view; S.id = id == null ? null : id;
  if (view === 'list') { renderList(); }
  else if (view === 'detail') { if (S.id !== DT.last) { DT.tab = 'goods'; DT.last = S.id; } renderDetail(); }
  else if (view === 'form') {
    const x = id ? reqById(id) : null;
    if (x && !can(x, 'edit')) { toast('Bạn không có quyền sửa phiếu này.', 'error'); return go('detail', id); }
    F = newForm(x); renderForm();
  }
  window.scrollTo(0, 0);
}
renderBar();
go('list');
</script>
