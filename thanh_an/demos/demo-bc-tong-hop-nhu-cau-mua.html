<!--
    DEMO — Báo cáo tổng hợp nhu cầu mua hàng, theo logic Phiếu xử lý cung ứng mới (tách Nguồn hàng).
    Vỏ màn hình (menu, tiêu đề, KPI, bộ lọc, nút) + CSS lấy nguyên từ màn thật trên dev (supply/reports/purchase-demand).
    CHỈ bảng được vẽ lại:
      - Chỉ lấy hàng có SL Mua thêm > 0 ở phiếu xử lý; cột Cần mua thêm = SL Mua thêm (không hiện mục đích, không hiện tồn kho / SL đang đi mua).
      - 2 tab: "Cần đi mua" (còn cần mua > 0) · "Đã có HĐ mua" (đã lập hợp đồng mua — chỉ tính HĐ mua, không tính đơn mua).
        Dòng mới mua 1 phần nằm ở CẢ 2 tab: tab 1 tính phần còn thiếu, tab 2 hiện phần đã lập chứng từ.
    Dòng đề xuất = dữ liệu thật trên dev (SL coi như SL Mua thêm); chứng từ mua + NCC là dữ liệu giả cho demo.
-->

        var el = document.createElement('div')
        el.className = 'demo-dd'
        el.style.left = rc.left + 'px'; el.style.top = (rc.bottom + 3) + 'px'; el.style.width = Math.max(rc.width, 220) + 'px'
        el.innerHTML = '<input type="text" placeholder="Tìm..."><ul></ul>'
        document.body.appendChild(el)
        ff.classList.add('is-open', 'is-float')
        dd = { ff: ff, fk: fk, el: el, act: -1, list: [] }
        var inp = el.querySelector('input'), ul = el.querySelector('ul')
        function draw() {
            var q = inp.value.trim().toLowerCase()
            var list = opts.filter(function (o) { return (o + ' ' + (SUB[fk] ? SUB[fk](o) : '')).toLowerCase().indexOf(q) >= 0 })
            dd.list = list
            if (dd.act >= list.length) dd.act = list.length - 1
            ul.innerHTML = list.length ? list.map(function (o, i) {
                var sub = SUB[fk] ? SUB[fk](o) : ''
                return '<li data-i="' + i + '" class="' + (o === state.f[fk] ? 'sel' : '') + (i === dd.act ? ' act' : '') + '">' + esc(o) +
                    (sub ? '<span class="dd-sub">' + esc(sub) + '</span>' : '') + '</li>'
            }).join('') : '<li class="none">Không có dữ liệu</li>'
        }
        function choose(i) { var v = dd.list[i]; if (v == null) return; closeDd(); setF(fk, v); render() }
        inp.addEventListener('input', function () { dd.act = 0; draw() })
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowDown') { dd.act = Math.min(dd.list.length - 1, dd.act + 1); draw(); e.preventDefault() }
            else if (e.key === 'ArrowUp') { dd.act = Math.max(0, dd.act - 1); draw(); e.preventDefault() }
            else if (e.key === 'Enter') { choose(dd.act < 0 ? 0 : dd.act); e.preventDefault() }
            else if (e.key === 'Escape') closeDd()
        })
        ul.addEventListener('mousemove', function (e) {
            var li = e.target.closest('li[data-i]'); if (!li || +li.dataset.i === dd.act) return
            dd.act = +li.dataset.i; draw()
        })
        ul.addEventListener('mousedown', function (e) {
            var li = e.target.closest('li[data-i]'); if (li) { e.preventDefault(); choose(+li.dataset.i) }
        })
        draw()
        inp.focus()
    }
    function eachFilter(fn) {
        Array.prototype.forEach.call(document.querySelectorAll('.smart-advanced-filters .ff, .pdr-toolbar .ff'), function (ff) {
            var lbl = ff.querySelector('.ff__text'), cfg = ff.dataset.fk === 'hd' ? FILTER_OPTS['Hợp đồng mua'] : lbl && FILTER_OPTS[lbl.textContent.trim()]
            if (cfg) fn(ff, cfg)
        })
    }
    eachFilter(function (ff, cfg) {
        ff.querySelector('.select2-selection').addEventListener('mousedown', function (e) {
            e.preventDefault()
            if (dd && dd.ff === ff) { closeDd(); return }
            closeDd(); openDd(ff, cfg[0], cfg[1])
        })
    })
    document.addEventListener('mousedown', function (e) {
        if (dd && !dd.el.contains(e.target) && !dd.ff.contains(e.target)) closeDd()
    })
    window.addEventListener('scroll', function (e) { if (dd && !dd.el.contains(e.target)) closeDd() }, true)
    window.addEventListener('resize', closeDd)
    function clearFilters() { closeDd(); eachFilter(function (ff, cfg) { setF(cfg[0], '') }) }

    // ================== Tạo đơn mua từ HĐ mua đang lọc (demo) ==================
    function closeModal() { var m = document.querySelector('.demo-mask'); if (m) m.remove() }
    document.getElementById('btnDmFromHd').addEventListener('click', function () {
        var no = state.f.hd, d = hdInfo(no)
        if (!no || !d) { toast('Lọc theo 1 hợp đồng mua trước', true); return }
        if (!d[3]) { toast('Hợp đồng ' + no + ' đang chờ duyệt — duyệt xong mới tạo được đơn mua', true); return }
        if (!Object.keys(state.pickHd).some(function (k) { return state.pickHd[k] })) {
            toast('Tick chọn ít nhất 1 hàng hóa của hợp đồng ' + no, true); return
        }
        // các dòng của HĐ thuộc hàng hóa đã tick (không phụ thuộc ô tìm nhanh / bộ lọc khác)
        var items = []
        ROWS.forEach(function (r) {
            if (!state.pickHd[r.code]) return
            r.lines.forEach(function (l) {
                docs(r, l).forEach(function (x) { if (x[1] === no) items.push({ r: r, l: l, q: n(x[4]) }) })
            })
        })
        var tot = items.reduce(function (s, it) { return s + it.q }, 0), pxl = {}
        items.forEach(function (it) { pxl[it.l.pxl] = 1 })
        var h = '<div class="demo-mask"><div class="demo-modal" role="dialog">' +
            '<div class="mh"><b>Tạo đơn mua từ hợp đồng ' + esc(no) + '</b><i class="ri-close-line x" data-close></i></div><div class="mb">' +
            '<div class="meta"><div><div class="k">Hợp đồng mua</div><div class="v mono">' + esc(no) + '</div></div>' +
            '<div><div class="k">Nhà cung cấp</div><div class="v">' + esc(NCC[d[2]]) + '</div></div>' +
            '<div><div class="k">Số dòng / phiếu xử lý</div><div class="v">' + items.length + ' dòng · ' + Object.keys(pxl).length + ' phiếu</div></div></div>' +
            '<table><thead><tr><th>STT</th><th>Mã nội bộ</th><th>Tên hàng</th><th>Phiếu xử lý</th><th>Khách hàng</th><th class="r">SL theo HĐ</th><th class="r">SL đặt đơn mua</th><th>ĐVT</th></tr></thead><tbody>'
        items.forEach(function (it, i) {
            h += '<tr><td>' + (i + 1) + '</td><td class="mono">' + esc(it.r.code) + '</td><td>' + esc(it.r.name) + '</td><td class="mono">' + esc(it.l.pxl) +
                '</td><td>' + esc(it.l.cust) + '</td><td class="r">' + fmt(it.q) + '</td><td class="r">' + fmt(it.q) + '</td><td>' + esc(it.l.unit) + '</td></tr>'
        })
        h += '</tbody><tfoot><tr><td colspan="5" class="r">Tổng</td><td class="r">' + fmt(tot) + '</td><td class="r">' + fmt(tot) + '</td><td></td></tr></tfoot></table>' +
            '<div class="note"><i class="ri-information-line"></i> SL đặt đơn mua mặc định = SL theo HĐ, sửa được ở form đơn mua. Đơn mua gắn với HĐ ' + esc(no) + ' và giữ liên kết phiếu xử lý từng dòng.</div>' +
            '</div><div class="mf"><button type="button" class="v2-btn v2-btn--sm v2-btn--secondary v2-btn--secondary-info" data-close>Hủy</button>' +
            '<button type="button" class="v2-btn v2-btn--sm v2-btn--primary v2-btn--primary-info v2-btn--prefix-sm" id="btnDmGo"><div class="v2-btn__prefix--sm"><i class="ri-shopping-cart-2-line" style="font-size: 13px;"></i></div> Tạo đơn mua</button></div></div></div>'
        document.body.insertAdjacentHTML('beforeend', h)
        var m = document.querySelector('.demo-mask')
        m.addEventListener('mousedown', function (e) { if (e.target === m || e.target.closest('[data-close]')) closeModal() })
        document.getElementById('btnDmGo').addEventListener('click', function () {
            closeModal()
            toast('Demo: mở form Tạo đơn mua — HĐ ' + no + ', ' + items.length + ' dòng, tổng SL ' + fmt(tot))
        })
    })
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal() })

    // ================== Tooltip ==================
    var tip = document.getElementById('demoTip')
    document.addEventListener('mouseover', function (e) {
        var el = e.target.closest('[data-tip]')
        if (!el) { tip.classList.remove('show'); return }
        tip.textContent = el.getAttribute('data-tip')
        var rc = el.getBoundingClientRect()
        tip.style.left = '0px'; tip.style.top = '0px'
        tip.classList.add('show')
        var tw = tip.offsetWidth, tH = tip.offsetHeight
        tip.style.left = Math.max(4, Math.min(window.innerWidth - tw - 4, rc.left + rc.width / 2 - tw / 2)) + 'px'
        tip.style.top = (rc.top - tH - 7 < 4 ? rc.bottom + 7 : rc.top - tH - 7) + 'px'
    })

    renderKpi()
    render()
})()
</script>
</body>
</html>
