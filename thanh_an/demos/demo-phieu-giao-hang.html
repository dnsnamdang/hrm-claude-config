<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu giao hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
/* ============ Token V2Base — cùng bộ với demo-lap-don-mua-hang.html ============ */
:root{
  --primary:#1abc9c; --primary-h:#17a589; --brand:#16a34a; --brand-bg:#f0fdf4; --brand-tx:#15803d;
  --danger:#dc2626; --err:#dc3545; --warn:#d97706; --info:#2563eb;
  --tx:#0f172a; --tx2:#1f2937; --tx3:#475569; --muted:#6b7280;
  --bd:#e5e7eb; --bd-in:#cbd5e1; --bd-btn:#e2e8f0;
  --bg:#f5f6f8; --card:#fff; --lock-bg:#f1f5f9; --link:#28539d;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;font-size:13px;color:var(--tx2);background:var(--bg)}
.container{padding:8px 16px 24px;max-width:1680px;margin:0 auto}
.page-title-box{display:flex;justify-content:space-between;align-items:center;padding:12px 0;flex-wrap:wrap;gap:6px}
.page-title{font-size:18px;font-weight:700;color:#111;margin:0}
.breadcrumb{font-size:12px;color:var(--muted)} .breadcrumb b{color:var(--tx3);font-weight:500}
.tp-card{background:#fff;border-radius:.5rem;border:1px solid var(--bd);box-shadow:0 6px 18px rgba(15,23,42,.04)}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mt-1{margin-top:4px}.mt-2{margin-top:8px}
/* section */
.sec{background:#fff;border:1px solid var(--bd);border-radius:.5rem;margin-bottom:8px}
.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd)}
.sec-h h6{font-size:14px;font-weight:700;color:var(--tx2);margin:0;display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-h .sp{flex:1}
.sec-b{padding:10px}
/* grid field */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:1/-1}
@media(max-width:860px){.grid,.grid.g4{grid-template-columns:1fr}.s2,.s3{grid-column:auto}}
.lbl-tip{color:var(--muted);font-weight:400;font-size:13px;cursor:help}
.v2-label{display:inline-flex;gap:4px;font-weight:600;color:var(--tx);font-size:12px;margin-bottom:4px;align-items:center}
.req{color:var(--danger)}
.v2-input,select.v2-input,textarea.v2-input{width:100%;border:1px solid var(--bd-in);border-radius:5px;padding:7px 10px;font-size:13px;color:var(--tx);font-family:inherit;background:#fff;height:34px}
textarea.v2-input{height:auto;min-height:56px;resize:vertical}
.v2-input.sm{height:28px;padding:3px 8px;font-size:12px}
.v2-input:focus{outline:none;border-color:#94a3b8}
.v2-input[disabled],.v2-input[readonly]{background:var(--lock-bg);color:var(--tx3);border-color:var(--bd-btn);cursor:not-allowed}
.v2-input.err{border-color:var(--err)}
.v2-input.num{text-align:right}
.err-tx{color:var(--err);font-size:11.5px;margin-top:3px;display:flex;gap:4px;align-items:center}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
/* ô khoá có link (như Đơn mua hàng ở chi tiết phiếu) */
.link-field{position:relative}
.link-field .lnk-in{position:absolute;left:11px;top:8px}
/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid transparent;font-weight:600;height:32px;padding:0 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;background:#fff}
.btn i{font-size:15px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
.btn-secondary{background:#fff;color:#333;border-color:var(--bd-in)}.btn-secondary:hover{background:#f8fafc}
.btn-tertiary{background:#fff;color:var(--tx2);border-color:var(--bd-btn)}
.btn-danger{background:var(--danger);color:#fff}
.btn[disabled]{background:#f1f5f9!important;color:#94a3b8!important;border-color:#e2e8f0!important;cursor:not-allowed}
.icon-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd-btn);background:#fff;color:#4b5563;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.icon-btn.danger{border-color:#fecaca;color:var(--danger);background:#fef2f2}
.icon-btn.ok{border-color:#a7f3d0;color:#047857;background:#ecfdf5}
/* tabs */
.tabs-nav{display:flex;padding:6px 8px}
.tabs-root{display:flex;gap:2px;padding:3px;background:#fff;border:1px solid var(--bd-btn);border-radius:10px;flex-wrap:wrap}
.tab-btn{height:28px;padding:0 .6rem;font-size:13px;font-weight:500;border-radius:7px;border:0;background:transparent;color:#334155;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.tab-btn i{font-size:15px;color:#64748b}
.tab-btn.active{background:var(--brand);color:#fff;font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.12)}
.tab-btn.active i{color:#fff}
.tab-btn:not(.active):hover{background:var(--brand-bg);color:var(--brand-tx)}
.tab-body{padding:12px;border-top:1px solid var(--bd)}
.card-body{padding:12px}
.form-footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--bd);flex-wrap:wrap}
/* badge */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:11px;border-radius:999px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-gray{color:#64748b;background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.2)}
.b-amber{color:#b45309;background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.25)}
.b-green{color:#15803d;background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.25)}
.b-red{color:#b91c1c;background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.25)}
.b-blue{color:#1d4ed8;background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.22)}
.lnk{color:var(--link);border-bottom:1px dashed #b7c4cf;cursor:pointer;font-weight:600}
.mut{color:var(--muted)}
.tr{text-align:right}.tc{text-align:center}
/* note boxes (banner trên card) */
.note{border-radius:6px;padding:10px 12px;font-size:13px;line-height:1.55;display:flex;gap:10px}
.note i{font-size:18px;line-height:1.2}
.note .nt{font-weight:700;margin-bottom:2px}
.note .pre{white-space:pre-line;word-break:break-word}
.note-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}
.note-warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.note-err{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid var(--danger);color:#7f1d1d}
.note-err i{color:var(--danger)}
.note-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.box{background:#f8fafc;border:1px dashed var(--bd-in);border-radius:6px;padding:8px 12px;font-size:12px;color:var(--tx3)}
/* bảng danh sách */
.tbl-wrap{overflow:auto;border:1px solid #d9e2e0;border-radius:6px;max-height:calc(100vh - 220px)}
table.pt{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.pt th{background:#eef4f3;color:#2c3e50;font-size:12px;font-weight:600;text-align:center;white-space:nowrap;border-right:1px solid #d9e2e0;border-bottom:1px solid #d9e2e0;padding:7px 8px;position:sticky;top:0;z-index:2}
.pt td{border-right:1px solid #e3e8ee;border-bottom:1px solid #e3e8ee;padding:6px 8px;vertical-align:middle;background:#fff;white-space:nowrap}
.pt tr:hover td{background:#f8fafc}
.pt .fz{position:sticky;z-index:1}.pt th.fz{z-index:3}
.pt .c-stt{left:0;width:46px;min-width:46px}
.pt .c-code{left:46px;min-width:130px;box-shadow:4px 0 6px -3px rgba(44,62,80,.18)}
.pt td.wrap{white-space:normal;min-width:180px;max-width:280px}
.row-acts{display:flex;gap:4px;justify-content:center}
/* bảng nhỏ trong form */
table.mt{width:100%;border-collapse:collapse;font-size:12.5px}
.mt th{background:#f8fafc;color:#374151;font-weight:600;padding:6px 8px;text-align:left;border:1px solid var(--bd);white-space:nowrap}
.mt td{padding:5px 8px;border:1px solid var(--bd);vertical-align:middle}
.mt tr.is-short td{background:#fffbeb}
.mt tfoot td{background:#f8fafc}
.mt td .v2-input{height:30px}
/* bộ lọc */
.flt-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;flex-wrap:wrap}
.flt-bar .q{flex:0 1 380px;position:relative}
.flt-bar .q i{position:absolute;left:10px;top:9px;color:#94a3b8}
.flt-bar .q input{padding-left:30px}
.flt-panel{padding:10px 12px;border-top:1px solid var(--bd);background:#fbfcfd}
.flt-panel .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.flt-panel .grid{grid-template-columns:1fr}}
.range{display:flex;gap:6px;align-items:center}
.list-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-size:12px;color:var(--muted)}
/* thẻ lấy hàng / điểm giao */
.dn-step{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
.dn-step.is-done{border-color:#bbf7d0;background:#fcfffd}
.dn-step__head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.dn-step__title{font-weight:700;font-size:13px;color:var(--tx);display:inline-flex;gap:6px;align-items:center}
.dn-step__title i{font-size:16px;color:var(--brand)}
.dn-hint{font-size:12px;color:var(--muted)}
.dn-warn{font-size:12px;color:#b45309;display:flex;gap:6px;align-items:flex-start}
.dn-route{margin-bottom:12px}
.files{display:flex;flex-direction:column;gap:2px}
.files a{color:var(--link);font-size:12px;cursor:pointer;text-decoration:underline}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
/* modal */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:2000;padding:6vh 12px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:560px;display:flex;flex-direction:column;max-height:90vh}
.m-h{display:flex;align-items:center;gap:10px;padding:10px .75rem;border-bottom:1px solid var(--bd)}
.m-ic{width:28px;height:28px;border-radius:999px;background:rgba(26,188,156,.1);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
.m-ic.danger{background:rgba(220,38,38,.1);color:var(--danger)}
.m-h h5{font-size:14px;font-weight:800;margin:0;flex:1}
.m-x{border:0;background:none;font-size:22px;cursor:pointer;color:#64748b;line-height:1}
.m-b{padding:.75rem;overflow-y:auto}
.m-f{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:10px .75rem;border-top:1px solid var(--bd)}
.toast{position:fixed;right:16px;bottom:16px;padding:10px 14px;border-radius:8px;font-size:12.5px;z-index:3000;display:none;max-width:460px;box-shadow:0 10px 30px rgba(0,0,0,.25);color:#fff;background:#0f172a}
.toast.ok{background:#15803d}.toast.bad{background:#b91c1c}
/* thanh giả lập (chỉ có trong demo) */
.demo-bar{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:8px 12px;border:1px dashed #f59e0b;background:#fffbeb;border-radius:8px;font-size:12px;color:#78350f}
.demo-bar b{font-weight:700}
.demo-bar select{height:30px;width:auto;font-size:12px;padding:3px 8px}
.demo-bar .tabs-root{background:#fff}
.hide{display:none!important}
.status-pill{margin-left:8px;vertical-align:middle}
.dp{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:#fff}
.dp-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.dp-no{background:var(--brand);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 9px}
.dp-h .nm{font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="container">

  <!-- ============ THANH GIẢ LẬP (chỉ có trong demo) ============ -->
  <div class="demo-bar">
    <b><i class="ri-flask-line"></i> Giả lập demo</b>
    <div class="tabs-root" id="scr-tabs">
      <button class="tab-btn" data-scr="po"><i class="ri-shopping-bag-3-line"></i>Đơn mua hàng</button>
      <button class="tab-btn" data-scr="list"><i class="ri-truck-line"></i>Phiếu giao hàng</button>
    </div>
    <label>Người đăng nhập <select class="v2-input" id="sel-user"></select></label>
    <label>Phương thức của đơn mẫu <select class="v2-input" id="sel-scn"></select></label>
    <button class="btn btn-tertiary" onclick="resetAll()"><i class="ri-restart-line"></i>Làm lại từ đầu</button>
  </div>

  <div id="screen"></div>
</div>

<!-- ============ POPUP GỬI BỘ PHẬN GIAO HÀNG (SendDeliveryNoteModal.vue) ============ -->
<div class="mask" id="m-send"><div class="modal">
  <div class="m-h"><div class="m-ic"><i class="ri-send-plane-line"></i></div><h5 id="send-title">Gửi bộ phận giao hàng</h5><button class="m-x" onclick="closeM('m-send')">×</button></div>
  <div class="m-b">
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="s3"><label class="v2-label">Phương thức giao hàng</label><input class="v2-input" id="send-ship" disabled></div>
      <div><label class="v2-label">Ngày lấy hàng<span class="req">*</span></label><input type="date" class="v2-input" id="send-date"><div id="send-date-err"></div></div>
      <div><label class="v2-label">Ưu tiên<span class="req">*</span></label><select class="v2-input" id="send-priority"><option value="1">Thường</option><option value="2">Gấp</option></select></div>
      <div class="s3"><label class="v2-label">Ghi chú cho bộ phận giao hàng</label><textarea class="v2-input" id="send-note" rows="3" maxlength="2000" placeholder="Lưu ý khi lấy / giao hàng (nếu có)"></textarea></div>
    </div>
  </div>
  <div class="m-f">
    <button class="btn btn-primary" onclick="submitSend()"><i class="ri-send-plane-line"></i><span id="send-btn-tx">Gửi</span></button>
    <button class="btn btn-tertiary" onclick="closeM('m-send')"><i class="ri-arrow-left-line"></i>Đóng</button>
  </div>
</div></div>

<!-- ============ POPUP TRẢ LẠI (ReturnNoteModal.vue) ============ -->
<div class="mask" id="m-return"><div class="modal">
  <div class="m-h"><div class="m-ic danger"><i class="ri-arrow-go-back-line"></i></div><h5 id="ret-title">Trả lại phiếu giao hàng</h5><button class="m-x" onclick="closeM('m-return')">×</button></div>
  <div class="m-b">
    <p style="font-size:13px;color:#4b5563;margin:0 0 8px">Phiếu sẽ về trạng thái <b>Bị trả lại</b>, người gửi phiếu nhận được thông báo kèm lý do để sửa và gửi lại.</p>
    <label class="v2-label">Lý do trả lại<span class="req">*</span></label>
    <textarea class="v2-input" id="ret-reason" rows="4" maxlength="2000" placeholder="Nhập lý do trả lại phiếu..."></textarea>
    <div id="ret-err"></div>
  </div>
  <div class="m-f">
    <button class="btn btn-danger" onclick="submitReturn()"><i class="ri-arrow-go-back-line"></i>Trả lại</button>
    <button class="btn btn-tertiary" onclick="closeM('m-return')"><i class="ri-arrow-left-line"></i>Đóng</button>
  </div>
</div></div>

<!-- ============ POPUP XÁC NHẬN (BaseConfirmModal) ============ -->
<div class="mask" id="m-confirm"><div class="modal" style="max-width:480px">
  <div class="m-h"><div class="m-ic" id="cf-ic"><i class="ri-question-line"></i></div><h5 id="cf-title">Xác nhận</h5><button class="m-x" onclick="closeM('m-confirm')">×</button></div>
  <div class="m-b" id="cf-msg" style="font-size:13px;line-height:1.6"></div>
  <div class="m-f">
    <button class="btn btn-primary" id="cf-ok" onclick="confirmOk()">Đồng ý</button>
    <button class="btn btn-tertiary" onclick="closeM('m-confirm')"><i class="ri-arrow-left-line"></i>Đóng</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>
<input type="file" id="file-pick" multiple class="hide">

<script>
/* =====================================================================
   Demo phiếu giao hàng — bám code thật (30/10/2026):
   FE  pages/supply/purchase_orders/_id + components/SendDeliveryNoteModal.vue
       pages/delivery/delivery_notes/index.vue, _id/index.vue,
       components/PickupBlock.vue, PointCard.vue, CostTable.vue, ReturnNoteModal.vue
   BE  Modules/Supply/Services/PurchaseDeliveryNoteService.php
   ===================================================================== */

// ---------- hằng số (khớp delivery_notes/constants.js) ----------
const SHIP = { NCC_KHO: 'ncc_kho', NCC_KH: 'ncc_kh', TU_LAY: 'tu_lay' }
const NOTE_STATUS = { WAITING: 2, RETURNED: 3, PROCESSING: 4, DONE: 5, CANCELED: 6 }
const NOTE_STATUS_OPTIONS = [
  { id: 2, text: 'Chờ tiếp nhận', color: '#D97706' },
  { id: 4, text: 'Đang xử lý', color: '#2563EB' },
  { id: 5, text: 'Hoàn thành', color: '#16A34A' },
  { id: 3, text: 'Bị trả lại', color: '#DC2626' },
  { id: 6, text: 'Đã hủy', color: '#6B7280' },
]
const PRIORITY_OPTIONS = [{ id: 1, text: 'Thường', color: '#94A3B8' }, { id: 2, text: 'Gấp', color: '#DC2626' }]
const SHIP_OPTIONS = [
  { id: 'ncc_kho', text: 'NCC giao tại kho công ty' },
  { id: 'ncc_kh', text: 'NCC giao thẳng cho khách hàng' },
  { id: 'tu_lay', text: 'Công ty tự lấy hàng tại NCC' },
]
const SHIP_BADGES = {
  ncc_kho: { text: 'NCC giao về kho', color: '#0EA5E9' },
  ncc_kh: { text: 'NCC giao thẳng KH', color: '#2563EB' },
  tu_lay: { text: 'Cty tự lấy', color: '#7C3AED' },
}
const ISSUE_REASON_OPTIONS = [
  { id: 'ncc_short', text: 'NCC giao thiếu' }, { id: 'damaged', text: 'Hỏng vỡ' },
  { id: 'kh_reject', text: 'KH từ chối một phần' }, { id: 'wrong_spec', text: 'Sai quy cách' }, { id: 'other', text: 'Khác' },
]
const COST_TYPE_OPTIONS = [
  { id: 'rent', text: 'Cước thuê xe / nhà xe' }, { id: 'fuel', text: 'Xăng dầu' }, { id: 'toll', text: 'Phí cầu đường' },
  { id: 'parking', text: 'Phí gửi xe, bến bãi' }, { id: 'loading', text: 'Bốc xếp' }, { id: 'allowance', text: 'Công tác phí' }, { id: 'other', text: 'Khác' },
]
const PAY_TO_OPTIONS = [{ id: 'self', text: 'Công ty tự chi' }, { id: 'vc', text: 'Đơn vị vận chuyển' }, { id: 'ncc', text: 'NCC' }]
const PO_STATUS = { 3: { text: 'Đã duyệt', cls: 'b-green' }, 7: { text: 'Đã gửi giao hàng', cls: 'b-blue' } }

// Phiếu giao hàng không phân quyền; chỉ gửi / sửa và gửi lại / hủy cần quyền "Lập đơn mua hàng"
const USERS = {
  bich: { name: 'Trần Thị Bích', dept: 'Phòng Cung ứng', canSend: true },
  hung: { name: 'Nguyễn Văn Hùng', dept: 'Bộ phận giao hàng', canSend: false },
  tuan: { name: 'Lê Minh Tuấn', dept: 'Bộ phận giao hàng', canSend: false },
}
const SCENARIOS = [
  { id: 'ncc_kho', text: 'NCC giao tại kho công ty', ship: 'ncc_kho', dest: 'kho' },
  { id: 'ncc_kh', text: 'NCC giao thẳng cho khách hàng', ship: 'ncc_kh', dest: 'kh' },
  { id: 'tu_lay_kho', text: 'Cty tự lấy → về kho', ship: 'tu_lay', dest: 'kho' },

// ---------- logic đơn mua ↔ phiếu (PurchaseDeliveryNoteService) ----------
// Cặp có thể gửi: về kho → mỗi dòng hàng; giao KH → (khách, dòng hàng) theo mục đích mua
function deliverablePairs(o) {
  const pairs = []
  PRODUCTS.forEach((p) => {
    if (o.dest === 'kh') Object.keys(p.alloc).forEach((c) => pairs.push({ key: `${c}:${p.id}`, point: c, pid: p.id, qty: p.alloc[c] }))
    else pairs.push({ key: `kho:${p.id}`, point: 'kho', pid: p.id, qty: qtyOf(p) })
  })
  return pairs
}
// SL đã dùng: phiếu Chờ tiếp nhận / Đang xử lý giữ qty_plan, phiếu Hoàn thành tính qty_delivered
function remainingPairs(o, exceptId) {
  const used = {}
  S.notes.filter((n) => n.order_id === o.id && n.id !== exceptId).forEach((n) => {
    n.points.forEach((pt) => pt.items.forEach((it) => {
      let q = 0
      if (n.status === 2 || n.status === 4) q = it.qty_plan
      else if (n.status === 5) q = it.qty_delivered || 0
      used[it.pairKey] = (used[it.pairKey] || 0) + q
    }))
  })
  return deliverablePairs(o).map((p) => Object.assign({}, p, { remaining: Math.round((p.qty - (used[p.key] || 0)) * 1000) / 1000 })).filter((p) => p.remaining > 0)
}
const notesOf = (o) => S.notes.filter((n) => n.order_id === o.id)
const returnedNoteOf = (o) => notesOf(o).filter((n) => n.status === 3).sort((a, b) => b.id - a.id)[0] || null
const canManageDelivery = (o) => me().canSend && [3, 7].includes(o.status)
function cannotSendReason(o, checkReturned) {
  if (![3, 7].includes(o.status)) return 'Chỉ gửi được đơn mua đã duyệt'
  if (checkReturned !== false && returnedNoteOf(o)) return 'Đơn có phiếu bị trả lại — hãy Sửa & gửi lại hoặc Hủy phiếu đó'
  if (!remainingPairs(o).length) return 'Đơn không còn số lượng cần gửi'
  return null
}
const canSend = (o) => canManageDelivery(o) && cannotSendReason(o) === null

function buildPoints(o, pairs) {
  const groups = {}
  pairs.forEach((p) => (groups[p.point] = groups[p.point] || []).push(p))
  return Object.keys(groups).map((k, gi) => {
    const id = S.seq * 100 + gi + Math.floor(Math.random() * 10000) * 1000
    const base = k === 'kho'
      ? { warehouse_id: o.warehouse.id, warehouse_name: o.warehouse.name, address: o.warehouse.address }
      : { customer_name: CUSTOMERS[k].name, address: CUSTOMERS[k].address, receiver_name: CUSTOMERS[k].receiver, receiver_phone: CUSTOMERS[k].phone }
    return Object.assign({ id, status: 1, signer: '', delivered_at: '', issue_reason: '', issue_note: '', delivered_wh: null }, base, {
      items: groups[k].map((p, i) => {
        const pr = PRODUCTS.find((x) => x.id === p.pid)
        return { id: id * 10 + i, pairKey: p.key, product_name: pr.name, unit_name: pr.unit, qty_plan: p.remaining, qty_picked: null, qty_delivered: null }
      }),
    })
  })
}

const otherSpent = (n) => S.notes.filter((x) => x.order_id === n.order_id && x.id !== n.id && [4, 5].includes(x.status)).reduce((a, x) => a + costTotal(x.costs), 0)

function missingForComplete(n) {
  const m = []
  if (n.ship === SHIP.TU_LAY && !n.picked_at) m.push('Chưa cập nhật lấy hàng tại NCC')
  const waiting = n.points.filter((p) => p.status !== 2).length

    ? `<tr><td>Chi phí tự lấy (công ty tự chi)</td><td class="tr">${money(o.self_cost)}</td></tr>`
    : `<tr><td>Phí vận chuyển NCC thu thêm</td><td class="tr">${money(o.ncc_fee)}</td></tr><tr><td>Đơn vị vận chuyển</td><td class="tr">${money(o.carrier_fee)}</td></tr>`
  return `<div class="sec"><div class="sec-h"><h6>Phương thức giao hàng</h6></div><div class="sec-b"><div class="grid">${dis('Phương thức giao hàng', shipLabel(o.ship, o.dest), 's2')}</div></div></div>
    <div class="sec"><div class="sec-h"><h6>${o.dest === 'kh' ? 'Điểm giao' : 'Kho nhận hàng'}</h6></div><div class="sec-b">${pts}</div></div>
    <div class="sec"><div class="sec-h"><h6>Chi phí vận chuyển dự kiến</h6></div><div class="sec-b">
      <table class="mt" style="max-width:520px"><thead><tr><th>Khoản</th><th class="tr">Số tiền (VNĐ)</th></tr></thead><tbody>${costRows}</tbody>
      <tfoot><tr><td><b>Tổng dự kiến</b></td><td class="tr"><b>${money(expectedCost(o))}</b></td></tr></tfoot></table></div></div>`
}

// Gửi / Sửa và gửi lại (SendDeliveryNoteModal)
function openSend(noteId) {
  const o = S.order, n = noteId ? findNote(noteId) : null
  S.ui.sendFor = n ? n.id : null
  $('send-title').textContent = n ? `Sửa và gửi lại phiếu giao hàng: ${n.code}` : 'Gửi bộ phận giao hàng'
  $('send-btn-tx').textContent = n ? 'Gửi lại' : 'Gửi'
  $('send-ship').value = shipLabel(o.ship, o.dest)
  $('send-date').value = n ? n.pickup_date : ''
  $('send-priority').value = n ? n.priority : 1
  $('send-note').value = n ? n.note : ''
  $('send-date').classList.remove('err'); $('send-date-err').innerHTML = ''
  openM('m-send')
}
function submitSend() {
  const o = S.order, date = $('send-date').value
  if (!date) { $('send-date').classList.add('err'); $('send-date-err').innerHTML = errTx('Ngày lấy hàng là bắt buộc'); return toast('Bạn chưa nhập đầy đủ thông tin.', 'bad') }
  const form = { pickup_date: date, priority: Number($('send-priority').value), note: $('send-note').value.trim() }
  if (S.ui.sendFor) {
    const n = findNote(S.ui.sendFor)
    if (n.status !== 3) return toast('Chỉ gửi lại được phiếu bị trả lại', 'bad')
    const rem = remainingPairs(o, n.id)
    if (!rem.length) { closeM('m-send'); return toast('Đơn không còn số lượng cần gửi — hãy hủy phiếu', 'bad') }
    Object.assign(n, form, { status: 2, points: buildPoints(o, rem), sent_by: S.user, sent_at: todayISO(), return_reason: '', returned_by: '', returned_at: '', owner: '', received_at: '' })
  } else {
    const r = cannotSendReason(o)
    if (r) { closeM('m-send'); return toast(r, 'bad') }
    const id = S.seq++
    S.notes.push(Object.assign({
      id, code: `PGH-2026-${String(id).padStart(4, '0')}`, order_id: o.id, order_code: o.code, supplier_name: SUPPLIER.name,
      ship: o.ship, dest: o.dest, status: 2, sent_by: S.user, sent_at: todayISO(), owner: '', received_at: '',
      picked_at: '', pickup_note: '', completed_at: '', has_diff: 0, no_cost: 0, costs: [], points: buildPoints(o, remainingPairs(o)),
    }, form))
  }
  o.status = 7 // Đã duyệt → Đã gửi giao hàng
  closeM('m-send')
  toast('Đã gửi phiếu sang bộ phận giao hàng. <br><small>(Bản thật quay về danh sách đơn mua — demo ở lại để xem tiếp.)</small>', 'ok')
  renderPO()
}
function askCancel(noteId) {
  const n = findNote(noteId)
  ask({
    title: 'Hủy phiếu giao hàng', danger: true, accept: 'Hủy phiếu',
    msg: `Hủy phiếu giao hàng <b>${esc(n.code)}</b>? Số lượng của phiếu sẽ trả về "Còn phải gửi" để gửi phiếu mới.`,
    ok: () => {
      if (n.status !== 3) return toast('Chỉ hủy được phiếu bị trả lại', 'bad')
      n.status = 6
      const o = S.order
      if (!notesOf(o).some((x) => [2, 4, 5].includes(x.status))) o.status = 3 // không còn phiếu nào → về Đã duyệt
      toast('Đã hủy phiếu giao hàng', 'ok'); renderPO()
    },
  })
}

// ---------------- MÀN 2: DANH SÁCH PHIẾU GIAO HÀNG ----------------
const FLT_DEFAULT = () => ({ open: false, q: '', code: '', order: '', supplier: '', ship: '', point: '', from: '', to: '', priority: '', owner: '', status: '' })
function filteredNotes() {
  const f = S.ui.flt, lc = (v) => String(v || '').toLowerCase()
  return S.notes.slice().sort((a, b) => b.id - a.id).filter((n) => {
    if (f.q && ![n.code, n.order_code, n.supplier_name].some((x) => lc(x).includes(lc(f.q)))) return false
    if (f.code && !lc(n.code).includes(lc(f.code))) return false
    if (f.order && !lc(n.order_code).includes(lc(f.order))) return false
    if (f.supplier && n.supplier_name !== f.supplier) return false
    if (f.ship && n.ship !== f.ship) return false
    if (f.point && !lc(destinationText(n)).includes(lc(f.point))) return false
    if (f.from && n.pickup_date < f.from) return false
    if (f.to && n.pickup_date > f.to) return false
    if (f.priority && String(n.priority) !== f.priority) return false
    if (f.owner && n.owner !== f.owner) return false
    if (f.status && String(n.status) !== f.status) return false
    return true
  })
}

    </div>
    <div class="flt-panel ${f.open ? '' : 'hide'}"><div class="grid">
      <div><label class="v2-label">Mã phiếu</label>${txt('code', 'Nhập mã phiếu')}</div>
      <div><label class="v2-label">Đơn mua hàng</label>${txt('order', 'Nhập mã đơn mua')}</div>

      <div><label class="v2-label">Trạng thái</label>${sel('status', NOTE_STATUS_OPTIONS)}</div>
    </div><div class="mt-2" style="text-align:right"><button class="btn btn-tertiary" onclick="S.ui.flt=Object.assign(FLT_DEFAULT(),{open:true});renderList()"><i class="ri-refresh-line"></i>Làm mới</button></div></div>
    <div style="padding:0 12px 4px"><div class="tbl-wrap"><table class="pt">
      <thead><tr><th class="fz c-stt">STT</th><th class="fz c-code">Mã phiếu</th><th>Đơn mua hàng</th><th>Nhà cung cấp</th><th>Phương thức giao hàng</th><th>Nơi nhận</th><th>Ngày lấy hàng</th><th>Ưu tiên</th><th>Người phụ trách</th><th>Trạng thái</th><th>Hành động</th></tr></thead>

// Tiếp nhận — ai bấm trước người đó phụ trách
function askReceive(id, from) {
  const n = findNote(id)
  ask({
    title: 'Xác nhận tiếp nhận', accept: 'Tiếp nhận',
    msg: from === 'list'
      ? `Tiếp nhận phiếu giao hàng <b>${esc(n.code)}</b>? Bạn sẽ là người phụ trách phiếu và thực hiện giao/nhận hàng.`
      : `Tiếp nhận phiếu giao hàng <b>${esc(n.code)}</b>? Bạn sẽ là người phụ trách và cập nhật tiến độ giao hàng của phiếu.`,
    ok: () => {
      if (n.status !== 2) return toast(n.owner ? `Phiếu đã được ${userName(n.owner)} tiếp nhận` : 'Phiếu không còn ở trạng thái chờ tiếp nhận', 'bad')
      Object.assign(n, { status: 4, owner: S.user, received_at: todayISO() })
      toast(from === 'list' ? `Đã tiếp nhận phiếu ${esc(n.code)}` : 'Đã tiếp nhận phiếu giao hàng', 'ok')
      go('detail', n.id)
    },
  })
}
function openReturn(id) {
  const n = findNote(id)
  S.ui.retFor = id
  $('ret-title').textContent = `Trả lại phiếu giao hàng: ${n.code}`
  $('ret-reason').value = ''; $('ret-reason').classList.remove('err'); $('ret-err').innerHTML = ''
  openM('m-return')
}
function submitReturn() {
  const n = findNote(S.ui.retFor), reason = $('ret-reason').value.trim()
  if (!reason) { $('ret-reason').classList.add('err'); $('ret-err').innerHTML = errTx('Lý do trả lại là bắt buộc'); return toast('Vui lòng nhập lý do trả lại', 'bad') }
  if (!canReturn(n)) { closeM('m-return'); render(); return toast(n.status === 4 && isOwner(n) ? 'Phiếu đã lấy hàng hoặc đã xác nhận điểm giao — không thể trả lại' : 'Không thể trả lại phiếu này', 'bad') }
  const d = new Date()
  Object.assign(n, { status: 3, return_reason: reason, returned_by: S.user, returned_at: `${pad(d.getHours())}:${pad(d.getMinutes())} ${fmtDate(todayISO())}`, owner: '' })
  closeM('m-return')
  toast('Trả lại phiếu giao hàng thành công', 'ok')

}

// ---------------- MÀN 3: CHI TIẾT PHIẾU GIAO HÀNG ----------------

  const inProgress = [4, 5].includes(n.status), isKh = n.dest === 'kh', editable = canEdit(n)
  const banners = []
  if (n.status === 3) banners.push(`<div class="note note-err mb-2"><i class="ri-arrow-go-back-line"></i><div><div class="nt">Bị trả lại${n.returned_by ? ' bởi ' + esc(userName(n.returned_by)) : ''}${n.returned_at ? ' lúc ' + esc(n.returned_at) : ''}</div><span class="pre">${esc(n.return_reason)}</span></div></div>`)

  if (n.status === 5) banners.push(`<div class="note note-ok mb-2"><i class="ri-checkbox-circle-line"></i><div>Đã hoàn thành giao hàng${n.completed_at ? ' lúc ' + esc(n.completed_at) : ''}.</div></div>`)

      ${dis('Nhà cung cấp', n.supplier_name)}${dis('Phương thức giao hàng', shipLabel(n.ship, n.dest))}
      ${dis('Ngày lấy hàng', fmtDate(n.pickup_date))}${dis('Người gửi', userName(n.sent_by))}${dis('Ngày gửi', fmtDate(n.sent_at))}
      ${dis('Người phụ trách', userName(n.owner))}${dis('Ngày tiếp nhận', n.owner ? fmtDate(n.received_at) : '')}
      ${!isKh ? dis('Kho nhận', wh) : ''}
      <div class="s3"><label class="v2-label">Ghi chú cung ứng</label><textarea class="v2-input" rows="2" disabled>${esc(n.note)}</textarea></div>

      <div class="dn-hint mb-1">${esc(p.address)}${p.receiver_name ? ` · Người nhận: ${esc(p.receiver_name)}${p.receiver_phone ? ` (${esc(p.receiver_phone)})` : ''}` : ''}</div>
      <table class="mt"><thead><tr><th style="width:44px">STT</th><th>Hàng hóa</th><th style="width:90px">ĐVT</th><th style="width:130px" class="tr">Số lượng</th></tr></thead>

// ----- Lấy hàng tại NCC (PickupBlock.vue) — chỉ khi công ty tự lấy -----
function allItems(n) { const r = []; n.points.forEach((p, pi) => p.items.forEach((it) => r.push({ it, p, pi }))); return r }
function pickupDraft(n) {
  if (!S.ui.pickup) {
    S.ui.pickup = { qty: {}, time: n.picked_at || nowLocal(), note: n.pickup_note || '', errs: {} }
    allItems(n).forEach(({ it }) => (S.ui.pickup.qty[it.id] = it.qty_picked === null ? it.qty_plan : it.qty_picked))
  }
  return S.ui.pickup
}
function pickupHtml(n, editable) {
  const picked = !!n.picked_at
  const editing = editable && (!picked || (S.ui.pickup && S.ui.pickup.editing))
  const multi = n.points.length > 1
  const pointLabel = (p, pi) => (multi ? `<div class="dn-hint">Điểm ${pi + 1}: ${esc(p.customer_name || p.address || '')}</div>` : '')
  let head = `<div class="dn-step__head"><span class="dn-step__title"><i class="ri-store-2-line"></i>Lấy hàng tại NCC</span>
    ${picked && !editing ? `<span class="badge b-green">Đã lấy ${fmtDateTime(n.picked_at)}</span>` : '<span class="badge b-gray">Chưa lấy</span>'}<span style="flex:1"></span>
    ${picked && !editing && editable && !anyPointDone(n) ? `<button class="btn btn-tertiary" onclick="startPickupEdit()"><i class="ri-edit-line"></i>Sửa</button>` : ''}</div>`
  if (editing) {
    const d = pickupDraft(n)
    const short = allItems(n).some(({ it }) => { const q = parseQty(d.qty[it.id]); return q !== null && q < it.qty_plan })
    return `<div class="dn-step">${head}
      <table class="mt"><thead><tr><th style="width:44px">STT</th><th>Hàng hóa</th><th style="width:90px">ĐVT</th><th style="width:130px" class="tr">SL yêu cầu</th><th style="width:160px">SL thực lấy<span class="req">*</span></th></tr></thead>
      <tbody>${allItems(n).map(({ it, p, pi }, i) => `<tr><td class="tc">${i + 1}</td><td>${esc(it.product_name)}${pointLabel(p, pi)}</td><td>${esc(it.unit_name)}</td><td class="tr">${fmtQty(it.qty_plan)}</td>

function pointRef(pid) { const n = findNote(S.detailId); const pi = n.points.findIndex((p) => p.id === pid); return { n, p: n.points[pi], pi } }
function rerenderPoint(pid) { const { n, p, pi } = pointRef(pid); $('pc-' + pid).innerHTML = pointHtml(n, p, pi, canEdit(n)) }
function savePoint(pid) {
  const { n, p } = pointRef(pid), d = S.ui.pts[pid], ncc = isNcc(n), isKh = n.dest === 'kh', errs = {}
  const label = ncc ? 'SL thực nhận' : 'SL thực giao'
  let short = false
  p.items.forEach((it) => {
    const q = parseQty(d.qty[it.id]), cap = ncc ? it.qty_plan : it.qty_picked
    if (q === null) errs['q' + it.id] = `${label} phải là số`
    else if (q < 0 || q > cap) errs['q' + it.id] = `${label} phải từ 0 đến ${fmtQty(cap)}`
    else if (q < it.qty_plan) short = true
  })
  if (isKh && !String(d.signer).trim()) errs.signer = 'Người ký nhận là bắt buộc'
  if (!isKh && !d.wh) errs.wh = 'Kho nhận là bắt buộc'
  if (!d.date) errs.date = (ncc ? 'Ngày nhận' : 'Ngày giao') + ' là bắt buộc'
  if (short && !d.reason) errs.reason = 'Lý do thiếu là bắt buộc'
  if (short && d.reason === 'other' && !String(d.desc).trim()) errs.desc = 'Mô tả là bắt buộc khi lý do là Khác'

  Object.assign(p, { status: 2, signer: isKh ? String(d.signer).trim() : '', delivered_wh: isKh ? null : Number(d.wh), delivered_at: d.date, issue_reason: short ? d.reason : '', issue_note: short ? String(d.desc).trim() : '' })

    msg: `Mở lại <b>Điểm ${pi + 1}: ${esc(place)}</b>? Số lượng ${isNcc(n) ? 'thực nhận' : 'thực giao'}, người ký nhận và lý do thiếu đã nhập sẽ bị xóa để nhập lại.`,
    ok: () => {

    : `<tr><td colspan="${editable ? 7 : 6}" class="tc dn-hint" style="padding:12px">${(editable ? d.noCost : n.no_cost) ? 'Chuyến này không phát sinh chi phí.' : 'Chưa có khoản chi nào.'}</td></tr>`
  return `<table class="mt"><thead><tr><th style="width:44px">STT</th><th style="width:210px">Loại${editable ? '<span class="req">*</span>' : ''}</th><th>Diễn giải</th><th style="width:160px" class="${editable ? '' : 'tr'}">Số tiền${editable ? '<span class="req">*</span>' : ''}</th><th style="width:180px">Trả cho${editable ? '<span class="req">*</span>' : ''}</th><th style="width:230px">Hóa đơn / biên lai</th>${editable ? '<th style="width:50px"></th>' : ''}</tr></thead>

function rerenderCost() { const n = findNote(S.detailId); $('cost-box').innerHTML = costHtml(n, canEdit(n)) }
function costSet(i, k, v, silent) {

  if (k === 'cost_type' && v === 'rent') r.pay_to = 'vc' // thuê xe → trả đơn vị vận chuyển

function costAdd() {

  d.noCost = false; d.dirty = true; rerenderCost()
}
function costDel(i) { S.ui.cost.rows.splice(i, 1); S.ui.cost.dirty = true; S.ui.cost.errs = {}; rerenderCost() }
function costFileDel(i, fi) { S.ui.cost.rows[i].files.splice(fi, 1); S.ui.cost.dirty = true; rerenderCost() }
let fileRow = null

})
function validateCosts() {
  const d = S.ui.cost, errs = {}
  if (!d.rows.length && !d.noCost) errs.costs = 'Chưa có chi phí — nhập chi phí hoặc tick "Không phát sinh chi phí"'
  d.rows.forEach((r, i) => {
    if (!r.cost_type) errs[i + 'type'] = 'Loại là bắt buộc'
    if (!(Number(r.amount) > 0) || !Number.isInteger(Number(r.amount))) errs[i + 'amount'] = 'Số tiền phải là số nguyên lớn hơn 0'
    if (!r.pay_to) errs[i + 'pay'] = 'Trả cho là bắt buộc'
    if (String(r.description || '').length > 255) errs[i + 'desc'] = 'Diễn giải tối đa 255 ký tự'
  })
  d.errs = errs
  return !Object.keys(errs).length
}
function saveCosts(silentOk) {
  const n = findNote(S.detailId), d = S.ui.cost
  if (!validateCosts()) { rerenderCost(); toast('Vui lòng kiểm tra lại bảng chi phí', 'bad'); return false }
  n.costs = d.rows.map((r) => Object.assign({}, r, { files: r.files.slice() }))
  n.no_cost = d.rows.length ? 0 : d.noCost ? 1 : 0
  d.dirty = false
  if (!silentOk) toast('Đã lưu chi phí', 'ok')
  rerenderCost(); return true
}

// ----- Hoàn thành giao hàng -----
function askComplete(id) {
  const n = findNote(id), d = S.ui.cost
  const total = d && d.noteId === id ? costTotal(d.rows) : costTotal(n.costs)
  ask({
    title: 'Hoàn thành giao hàng', accept: 'Hoàn thành',
    msg: `Hoàn thành phiếu giao hàng <b>${esc(n.code)}</b>?<br>Chi phí thực tế ${money(total)}đ (dự kiến ${money(orderExpected(n))}đ).<br>Sau khi hoàn thành không sửa được phiếu.`,
    ok: () => {
      if (d && d.noteId === id && d.dirty && !saveCosts(true)) return // lưu chi phí đang sửa trước
      const missing = missingForComplete(n)
      if (missing.length) return toast(`Chưa thể hoàn thành: ${missing.join('; ')}`, 'bad')
      const now = new Date()
      Object.assign(n, { status: 5, completed_at: `${pad(now.getHours())}:${pad(now.getMinutes())} ${fmtDate(todayISO())}`,
        has_diff: n.points.some((p) => p.items.some((it) => (it.qty_delivered || 0) < it.qty_plan)) ? 1 : 0 })
      toast('Đã hoàn thành phiếu giao hàng', 'ok')
      go('list')
    },
  })
}

// ----- popup xác nhận dùng chung -----
let confirmCb = null
function ask({ title, msg, accept, danger, ok }) {
  $('cf-title').textContent = title; $('cf-msg').innerHTML = msg
  $('cf-ok').textContent = accept || 'Đồng ý'; $('cf-ok').className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary')
  $('cf-ic').className = 'm-ic' + (danger ? ' danger' : '')
  confirmCb = ok; openM('m-confirm')
}
function confirmOk() { closeM('m-confirm'); const cb = confirmCb; confirmCb = null; if (cb) cb() }

// ---------- khởi tạo ----------
$('sel-user').innerHTML = Object.keys(USERS).map((k) => `<option value="${k}">${USERS[k].name} — ${USERS[k].dept}${USERS[k].canSend ? ' (quyền Lập đơn mua hàng)' : ''}</option>`).join('')
$('sel-scn').innerHTML = SCENARIOS.map((s) => `<option value="${s.id}">${s.text}</option>`).join('')
$('sel-scn').value = 'tu_lay_kh'
$('sel-user').addEventListener('change', (e) => { S.user = e.target.value; S.ui.pickup = null; S.ui.pts = {}; S.ui.cost = null; render() })
$('sel-scn').addEventListener('change', () => resetAll(true))
document.querySelectorAll('#scr-tabs .tab-btn').forEach((b) => b.addEventListener('click', () => go(b.dataset.scr)))
document.querySelectorAll('.mask').forEach((m) => m.addEventListener('click', (e) => { if (e.target === m) m.classList.remove('show') }))
resetAll()
</script>
