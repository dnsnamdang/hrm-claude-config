<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu giao hàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<style>
/* ============ Token V2Base (port từ hrm-thanhan-client/assets/scss/v2-styles.scss) ============ */
:root{
  --primary:#1abc9c; --primary-h:#17a589; --brand:#16a34a; --danger:#dc2626; --err:#dc3545;
  --tx:#0f172a; --tx2:#1f2937; --tx3:#475569; --muted:#6b7280;
  --bd:#e5e7eb; --bd-in:#cbd5e1; --bd-btn:#e2e8f0; --bg:#f5f6f8; --lock-bg:#f1f5f9; --link:#28539d;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;font-size:13px;color:var(--tx2);background:var(--bg)}
.container{padding:8px 16px 24px;max-width:1680px;margin:0 auto}
.page-title-box{display:flex;justify-content:space-between;align-items:center;padding:12px 0;flex-wrap:wrap;gap:6px}
.page-title{font-size:18px;font-weight:700;color:#111;margin:0}
.breadcrumb{font-size:12px;color:var(--muted)} .breadcrumb b{color:var(--tx3);font-weight:500}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}
.sec{background:#fff;border:1px solid var(--bd);border-radius:.5rem;margin-bottom:8px}
.sec-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.sec-h h6{font-size:14px;font-weight:700;color:var(--tx2);margin:0}
.sec-h .sp,.sp{flex:1}
.sec-b{padding:10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 16px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.s2{grid-column:span 2}.s3{grid-column:1/-1}
@media(max-width:860px){.grid,.grid.g2{grid-template-columns:1fr}.s2,.s3{grid-column:auto}}
.v2-label{display:inline-flex;gap:4px;font-weight:600;color:var(--tx);font-size:12px;margin-bottom:4px;align-items:center}
.req{color:var(--danger)}
.tip{color:var(--muted);font-weight:400;font-size:13px;cursor:help}
.v2-input,select.v2-input,textarea.v2-input{width:100%;border:1px solid var(--bd-in);border-radius:5px;padding:7px 10px;font-size:13px;color:var(--tx);font-family:inherit;background:#fff;height:34px}
textarea.v2-input{height:auto;min-height:56px;resize:vertical}
.v2-input:focus{outline:none;border-color:#94a3b8}
.v2-input[disabled]{background:var(--lock-bg);color:var(--tx3);border-color:var(--bd-btn);cursor:not-allowed}
.v2-input.err{border-color:var(--err)}
.v2-input.sm{height:28px;padding:3px 8px;font-size:12px}
.err-tx{color:var(--err);font-size:11.5px;margin-top:3px;display:flex;gap:4px;align-items:center}
.hint{font-size:11.5px;color:var(--muted);margin-top:3px}
.fwa{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fwa .v2-input{min-width:0;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;border:1px solid transparent;font-weight:600;height:32px;padding:0 10px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;background:#fff}
.btn i{font-size:15px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-h)}
.btn-secondary{background:#fff;color:#333;border-color:var(--bd-in)}.btn-secondary:hover{background:#f8fafc}
.btn-danger-o{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.btn-tertiary{background:#fff;color:var(--tx2);border-color:var(--bd-btn)}
.btn-sm{height:26px;font-size:11.5px;padding:0 8px}
.btn-block{width:100%;height:38px;font-size:13px}
.btn[disabled]{background:#f1f5f9!important;color:#94a3b8!important;border-color:#e2e8f0!important;cursor:not-allowed}
.icon-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd-btn);background:#fff;color:#4b5563;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.icon-btn.danger{border-color:#fecaca;color:var(--danger);background:#fef2f2}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;font-size:11px;border-radius:999px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.b-gray{color:#64748b;background:rgba(100,116,139,.1);border-color:rgba(100,116,139,.2)}
.b-amber{color:#b45309;background:rgba(217,119,6,.1);border-color:rgba(217,119,6,.25)}
.b-green{color:#15803d;background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.25)}
.b-red{color:#b91c1c;background:rgba(220,38,38,.08);border-color:rgba(220,38,38,.25)}
.b-blue{color:#1d4ed8;background:rgba(37,99,235,.08);border-color:rgba(37,99,235,.22)}
.b-violet{color:#6d28d9;background:rgba(124,58,237,.08);border-color:rgba(124,58,237,.22)}
.b-cyan{color:#0e7490;background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.25)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;border:1px solid var(--bd-btn);background:#f8fafc;color:var(--tx3);font-size:11.5px;cursor:pointer;font-family:inherit}
.chip.on{background:#dcfce7;color:#15803d;border-color:var(--brand);font-weight:600}
.chip[disabled]{cursor:not-allowed;opacity:.6}
.lnk{color:var(--link);border-bottom:1px dashed #b7c4cf;cursor:pointer;font-weight:600}
.mono{font-family:Consolas,monospace;font-size:11.5px}
.mut{color:var(--muted)} .sm{font-size:11.5px}
.tr{text-align:right}.tc{text-align:center}
.note{border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.55;display:flex;gap:8px}
.note i{font-size:16px;line-height:1.2}
.note-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}
.note-warn{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.note-err{background:#fef2f2;border:1px solid #fecaca;border-left:4px solid var(--danger);color:#7f1d1d}
.note-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 16px}
.kv.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:860px){.kv,.kv.k3{grid-template-columns:1fr 1fr}}
.kv .k{font-size:11px;color:var(--muted)} .kv .v{font-weight:600;color:var(--tx);font-size:12.5px}

/* Flow */
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px 12px}
@media(max-width:960px){.flow{grid-template-columns:1fr 1fr}}
.st{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.st:hover{background:#f8fafc}
.st.lock{cursor:not-allowed;opacity:.55}
.st .no{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;border:2px solid var(--bd-in);color:var(--tx3);background:#fff}
.st.done .no{background:var(--brand);border-color:var(--brand);color:#fff}
.st.cur .no{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 4px rgba(26,188,156,.15)}
.st.active{background:#ecfdf5}
.st .t{font-weight:700;font-size:12.5px;color:var(--tx)}
.st .r{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-top:1px}
.st .s{font-size:11px;margin-top:3px}
.rolebar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:#fff;border:1px dashed var(--bd-in);margin-bottom:8px;font-size:12px;color:var(--tx3);flex-wrap:wrap}
.rolebar .who{font-weight:700;color:var(--tx)}
.rolebar select{height:28px;border:1px solid var(--brand);border-radius:6px;font-family:inherit;font-size:12px;padding:0 6px;color:#15803d;font-weight:600;background:#f0fdf4}

/* Tables */
.tbl-wrap{overflow:auto;border:1px solid #d9e2e0;border-radius:6px}
table.pt{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
.pt th{background:#eef4f3;color:#2c3e50;font-size:11.5px;font-weight:600;text-align:center;white-space:nowrap;border-right:1px solid #d9e2e0;border-bottom:1px solid #d9e2e0;padding:6px}
.pt td{border-right:1px solid #e3e8ee;border-bottom:1px solid #e3e8ee;padding:5px 6px;vertical-align:middle;background:#fff}
.pt tr.grp td{background:#f6f9fc;font-weight:700;color:#1e3a8a}
.pt tr.total td{background:#eef4f3;font-weight:700}
.pt tr.click{cursor:pointer}.pt tr.click:hover td{background:#f8fafc}
.pt tr.hl td{background:#f0fdf4}
.pt tr.errrow td{background:#fef2f2}
.pt .inp{width:84px;height:28px;border:1px solid var(--bd-in);border-radius:5px;padding:2px 6px;text-align:right;font-family:inherit;font-size:12px}
.pt .inp.over{border-color:var(--err);background:#fef2f2;color:#b91c1c}
.cell-name b{display:block;color:var(--tx);font-weight:600} .cell-name span{font-size:11px;color:var(--muted)}
.qneg{color:#b91c1c;font-weight:700}.qok{color:#15803d;font-weight:700}

/* Route */
.route{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.stop{flex:1 1 260px;border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff}
.stop.pick{background:#fffbeb;border-color:#fde68a}
.stop .sh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.stop .sn{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;background:#dbeafe;color:#1d4ed8}
.stop.pick .sn{background:#fde68a;color:#92400e}
.stop .nm{font-weight:700;color:var(--tx)}
.stop .ad{font-size:11.5px;color:var(--tx3);line-height:1.55}
.arrow{display:flex;align-items:center;color:#94a3b8;font-size:22px}

/* Tabs */
.tabs-root{display:flex;gap:2px;border-bottom:1px solid var(--bd);padding:0 8px;flex-wrap:wrap}
.tab-btn{border:0;background:none;padding:10px 12px;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;display:flex;gap:6px;align-items:center;margin-bottom:-1px}
.tab-btn.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab-btn .badge{padding:0 6px}
.ftabs{display:flex;gap:2px;padding:3px;background:#fff;border:1px solid var(--bd-btn);border-radius:10px;flex-wrap:wrap}
.ftab{height:28px;padding:0 .6rem;font-size:12.5px;font-weight:500;border-radius:7px;border:0;background:transparent;color:#334155;display:flex;align-items:center;gap:5px;cursor:pointer;font-family:inherit}
.ftab.active{background:var(--brand);color:#fff;font-weight:600}
.ftab .badge{padding:0 6px}
.ftab.active .badge{background:#fff;color:#15803d}

/* Step cards (tiến độ) */
.step{border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:#fff}
.step.done{border-color:#bbf7d0}
.step.lockc{opacity:.6}
.step-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.step.done .step-h{background:#f7fef9}
.step-h .nm{font-weight:700;color:var(--tx)}
.step-b{padding:10px}

/* Files / checklist / timeline */
.file{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:6px;background:#f1f5f9;border:1px solid var(--bd);font-size:11.5px;margin:2px 4px 2px 0;color:var(--tx2)}
.file i{color:#64748b}.file .x{cursor:pointer;color:#94a3b8}.file .x:hover{color:var(--danger)}
.ck{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--bd);font-size:12.5px;cursor:pointer;line-height:1.45}
.ck i{font-size:17px;line-height:1.1}.ck.ok i{color:var(--brand)}.ck.no i{color:#94a3b8}.ck.bad i{color:var(--danger)}.ck.bad{color:#b91c1c}
.owner{display:flex;gap:10px;align-items:center}
.av{width:38px;height:38px;border-radius:50%;background:#dcfce7;color:#15803d;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 38px}
.av.none{background:#f1f5f9;color:#94a3b8}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;gap:10px;padding:0 0 12px;position:relative}
.tl li:not(:last-child)::before{content:'';position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--bd)}
.tl .d{width:24px;height:24px;flex:0 0 24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:#dcfce7;color:#15803d;border:1px solid #86efac}
.tl .d.warn{background:#fef3c7;color:#b45309;border-color:#fde68a}
.tl .d.bad{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.tl .x{font-size:12px;line-height:1.5}.tl .x b{color:var(--tx)}.tl .x .tm{font-size:11px;color:var(--muted)}

.two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:8px;align-items:start}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
.side{position:sticky;top:8px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:860px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.kpi .k{font-size:11px;color:var(--muted)}.kpi .v{font-size:18px;font-weight:700;color:var(--tx)}
.form-footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;background:#fff;border:1px solid var(--bd);border-radius:.5rem;flex-wrap:wrap}
.form-footer .left{margin-right:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rules h4{font-size:13.5px;margin:14px 0 6px;color:var(--tx)}
.rules ol,.rules ul{margin:0;padding-left:20px;line-height:1.7;font-size:12.5px}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:2000;padding:6vh 12px}
.mask.show{display:flex}
.modal{background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.25);width:100%;max-width:560px;display:flex;flex-direction:column;max-height:88vh}
.m-h{display:flex;align-items:center;gap:10px;padding:10px .75rem;border-bottom:1px solid var(--bd)}
.m-ic{width:28px;height:28px;border-radius:999px;background:rgba(26,188,156,.1);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
.m-ic.red{background:#fee2e2;color:var(--danger)}
.m-h h5{font-size:14px;font-weight:800;margin:0;flex:1}
.m-x{border:0;background:none;font-size:22px;cursor:pointer;color:#64748b;line-height:1}
.m-b{padding:.75rem;overflow-y:auto;font-size:12.5px;line-height:1.6}
.m-f{display:flex;gap:8px;justify-content:flex-end;padding:10px .75rem;border-top:1px solid var(--bd)}
.toast{position:fixed;right:16px;bottom:16px;background:#0f172a;color:#fff;padding:10px 14px;border-radius:8px;font-size:12.5px;z-index:3000;display:none;max-width:460px;box-shadow:0 10px 30px rgba(0,0,0,.25);line-height:1.5}
input[type=radio],input[type=checkbox]{accent-color:var(--brand)}
.cb{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:12.5px;margin-right:14px;line-height:2}
</style>
</head>
<body>
<div class="container">
  <div class="page-title-box">
    <div>
      <div class="breadcrumb">Cung ứng / <b>Phiếu giao hàng</b> · demo luồng (dữ liệu giả)</div>
      <h1 class="page-title">Phiếu giao hàng — Đơn mua hàng gửi Bộ phận giao hàng</h1>

    <div class="fwa">

  <div class="rolebar" id="rolebar"></div>

</div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

/* ======================= Helpers ======================= */
const $ = (s)=>document.querySelector(s);
const pad = (n)=>String(n).padStart(2,'0');
const fmt = (n)=>(+n||0).toLocaleString('vi-VN');
const esc = (s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy = (d)=>{ if(!d) return ''; const [y,m,dd]=d.split('-'); return `${dd}/${m}/${y}`; };
function nowStr(){ const d=S.t; return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function tick(min){ S.t = new Date(S.t.getTime()+min*60000); return nowStr(); }
function setClock(date, time){ const [y,m,d]=date.split('-').map(Number); const [h,mi]=(time||'08:00').split(':').map(Number); const nt=new Date(y,m-1,d,h,mi); if(nt>S.t) S.t=nt; }
function badge(st){ const s=ST[st]; return `<span class="badge ${s.c}">${s.t}</span>`; }
function meObj(){ return TEAM.find(x=>x.id===S.me); }
function initials(n){ const w=n.split(' '); return (w[w.length-2]||'')[0]+(w[w.length-1]||'')[0]; }
function lineById(id){ return LINES.find(l=>l.id===id); }
function isNcc(){ return S.ship!=='tu_lay'; }
function dest(){ return S.ship==='ncc_kho' ? 'kho' : S.ship==='ncc_kh' ? 'kh' : S.selfDest; }
function shortShip(){ return {ncc_kho:'NCC giao về kho', ncc_kh:'NCC giao thẳng KH'}[S.ship] || (S.selfDest==='kho'?'Cty tự lấy → về kho':'Cty tự lấy → giao KH'); }
function points(){ return dest()==='kho' ? [WAREHOUSE] : [...new Set(LINES.map(l=>l.cust))].map(id=>CUSTOMERS[id]); }
function pointOf(l){ return dest()==='kho' ? 'KHO' : l.cust; }
function pointById(id){ return points().find(p=>p.id===id); }
function linesOf(pid){ return LINES.filter(l=>pointOf(l)===pid); }
function cur(){ return S.pghs.find(p=>p.id===S.cur) || null; }
function isKho(pid){ return pid==='KHO'; }
function shipLabel(){
  if (S.ship==='ncc_kho') return 'NCC giao về kho';
  if (S.ship==='ncc_kh') return 'NCC giao thẳng khách hàng';
  return dest()==='kho' ? 'Công ty tự lấy hàng tại NCC → Lấy về kho công ty' : 'Công ty tự lấy hàng tại NCC → Giao luôn cho khách hàng';
}
const planQty = (p,lid)=>+p.qty[lid]||0;
// NCC giao: không có bước lấy hàng → "đã lấy từ NCC" = thực nhận tại điểm
const pickedQty = (p,lid)=>isNcc() ? dlvQty(p,lid) : (p.pickup.done ? (+p.pickup.actual[lid]||0) : 0);
// SL tối đa được giao tại điểm: tự lấy = đã lấy, NCC giao = SL yêu cầu
const capQty = (p,lid)=>isNcc() ? planQty(p,lid) : pickedQty(p,lid);
function dlvQty(p,lid){ const d=p.dlv[pointOf(lineById(lid))]; return d && d.done ? (+d.actual[lid]||0) : 0; }
function sumPicked(lid){ return S.pghs.filter(p=>p.status===5).reduce((s,p)=>s+pickedQty(p,lid),0); }
function sumDelivered(lid){ return S.pghs.filter(p=>p.status===5).reduce((s,p)=>s+dlvQty(p,lid),0); }
function sumOpen(lid){ return S.pghs.filter(p=>OPEN.includes(p.status)).reduce((s,p)=>s+planQty(p,lid),0); }
function remain(lid){ return lineById(lid).qty - sumPicked(lid) - sumOpen(lid); }
function orderDone(){ return LINES.every(l=>sumPicked(l.id)>=l.qty); }
function costTotal(p){ return p.costs.reduce((s,c)=>s+(+c.amount||0),0); }
function pointStatus(pid){
  const ls = linesOf(pid);
  const need = ls.reduce((s,l)=>s+l.qty,0), dl = ls.reduce((s,l)=>s+sumDelivered(l.id),0);
  const opening = S.pghs.some(p=>OPEN.includes(p.status) && ls.some(l=>planQty(p,l.id)>0));
  if (dl>=need) return `<span class="badge b-green"><i class="ri-check-line"></i>${isKho(pid)?'Đã bàn giao kho':'Đã giao'}</span>`;
  if (opening) return `<span class="badge b-violet">Đang giao</span>`;
  if (dl>0) return `<span class="badge b-amber">Giao một phần ${fmt(dl)}/${fmt(need)}</span>`;
  return `<span class="badge b-gray">Chờ giao</span>`;
}
function canSend(){
  if (S.pghs.some(p=>p.status===3)) return {ok:false, why:'Có phiếu bị trả lại — sửa & gửi lại phiếu đó.'};
  if (LINES.every(l=>remain(l.id)<=0)) return {ok:false, why:'Đã gửi bộ phận giao hàng toàn bộ SL của đơn mua.'};
  return {ok:true};
}

function activeStep(){
  const p=cur();
  if (S.view==='order') return 0;
  if (S.view==='inbox') return 1;
  if (S.view==='pgh') return p && p.status>=4 ? 2 : 1;
  return -1;
}
function stepState(i){
  const p=cur(), st=p?p.status:0;
  return {reached:[true, !!p, st>=4][i], done:[!!p && st!==3, st>=4, st===5][i]};
}
function stepSub(i){
  const p=cur();
  if (i===0) return orderDone() ? '<span class="badge b-green">Đơn mua hoàn thành</span>' : '<span class="badge b-green">Đã duyệt</span>';
  if (!p) return '';
  if (i===1) return `<span class="mono">${p.code}</span> ${p.status<4?badge(p.status):''}`;
  if (i===2) return p.owner ? `<span class="sm mut"><i class="ri-user-star-line"></i> ${esc(p.owner)}</span> ${p.status>=4?badge(p.status):''}` : '';
}
function renderFlow(){
  const ai = activeStep();
  $('#flow').innerHTML = STEPS.map((s,i)=>{ const st=stepState(i);
    return `<div class="st ${st.done?'done':''} ${i===ai?'active cur':''} ${st.reached?'':'lock'}" onclick="stepClick(${i})">
      <div class="no">${st.done?'<i class="ri-check-line"></i>':i+1}</div>
      <div><div class="t">${s.t}</div><div class="r"><i class="${s.i}"></i>${s.r}</div><div class="s">${stepSub(i)}</div></div></div>`; }).join('');
}
function stepClick(i){
  if (!stepState(i).reached) return toast('Chưa tới bước này — làm lần lượt theo luồng.');
  if (i===0) return go('order');
  if (i===1) return go('inbox');
  S.tab='progress'; go('pgh');
}

      <div><div class="v2-label">Mức ưu tiên</div><select id="f_pr" class="v2-input"><option value="normal" ${v.prio==='normal'?'selected':''}>Bình thường</option><option value="urgent" ${v.prio==='urgent'?'selected':''}>Gấp</option></select></div>
      <div class="s3"><div class="v2-label">Ghi chú cho bộ phận giao hàng</div><textarea id="f_nt" class="v2-input" placeholder="${isNcc()?'VD: NCC báo xe tới khoảng 9h, cần người có mặt nhận + thu hóa đơn, biên bản':'VD: NCC chỉ xuất hàng buổi sáng, hàng lạnh cần mang thùng đá'}">${esc(v.note)}</textarea></div>
    </div>
    <div class="hint mt-2">Người nhận, SĐT, địa chỉ lấy theo điểm giao của đơn mua. Phiếu không cần duyệt.</div>`,
    onOk:()=>{
      const f = {pickupDate:$('#f_pd').value, prio:$('#f_pr').value, note:$('#f_nt').value};
      if (!f.pickupDate){ $('#f_err').style.display='flex'; $('#f_pd').classList.add('err'); return false; }
      const t = tick(5);
      let q;
      if (p){ Object.assign(p, f); q=p; p.status=2; p.sentAt=t; LINES.forEach(l=>p.qty[l.id]=Math.max(0,remain(l.id))); p.history.push({at:t, who:U.supply, t:'Sửa và gửi lại bộ phận giao hàng'}); }
      else q = newPgh(f, t);
      S.cur = q.id; S.inboxTab='wait'; go('inbox');
      toast(`<i class="ri-notification-3-line"></i> Đã gửi ${q.code}. ${TEAM.length} thành viên bộ phận giao hàng nhận thông báo "Có phiếu giao hàng mới chờ tiếp nhận".`);
    }});
}
function newPgh(f, t){
  const id = Date.now();
  const p = Object.assign({id, code:`PGH-00${S.seq++}/2026`, status:2, sentAt:t, sentBy:U.supply, qty:{}, pts:[], pinfo:{}, owner:'', receivedAt:'',
    ship:shortShip(),
    pickup:{done:false, date:f.pickupDate, time:'08:00', actual:{}, note:''}, dlv:{}, costs:[], noCost:false, history:[], returnReason:'', diff:false}, f);
  LINES.forEach(l=>p.qty[l.id]=Math.max(0,remain(l.id)));
  p.pts = points().map(x=>x.id).filter(pid=>linesOf(pid).some(l=>p.qty[l.id]>0));
  p.pts.forEach(pid=>{ const pt=pointById(pid); p.pinfo[pid]={receiver:pt.receiver, phone:pt.phone, window:pt.window}; });
  p.history.push({at:t, who:U.supply, t:'Gửi bộ phận giao hàng từ đơn mua DMH-0158/2026'});
  S.pghs.push(p); return p;
}

/* ======================= 2. Bộ phận giao hàng — danh sách ======================= */
const ITABS = [['wait','Chờ tiếp nhận',r=>r.status===2],['doing','Đang xử lý',r=>r.status===4],['mine','Của tôi',r=>r.owner===meObj().name && r.status===4],['done','Hoàn thành',r=>r.status===5],['back','Bị trả lại',r=>r.status===3],['all','Tất cả',()=>true]];
function inboxRows(){
  const mine = S.pghs.map(p=>({real:true, id:p.id, code:p.code, order:'DMH-0158/2026', sup:SUPPLIER.name, method:p.ship, dest:p.pts.map(id=>pointById(id).name).join(' · '), pts:p.pts.length,
    pick:dmy(p.pickupDate), prio:p.prio, by:p.sentBy, owner:p.owner, status:p.status, diff:p.diff}));
  return [...mine, ...SAMPLE_ROWS];
}
function vInbox(){

  const body = rows.length ? rows.map((r,i)=>{
    let act;

    else if (r.status===2) act = `<button class="btn btn-primary btn-sm" onclick="S.cur=${r.id};receivePgh()"><i class="ri-hand-heart-line"></i>Tiếp nhận</button> <button class="icon-btn danger" title="Trả lại cung ứng" onclick="S.cur=${r.id};returnPgh()"><i class="ri-arrow-go-back-line"></i></button> <button class="icon-btn" title="Xem" onclick="openPgh(${r.id})"><i class="ri-eye-line"></i></button>`;
    else act = `<button class="icon-btn" title="Xem" onclick="S.cur=${r.id};S.tab='progress';go('pgh')"><i class="ri-eye-line"></i></button>`;
    return `<tr class="${r.real?'hl':''}"><td class="tc">${i+1}</td><td class="mono">${r.real?`<span class="lnk" onclick="S.cur=${r.id};S.tab='progress';go('pgh')">${r.code}</span>`:r.code}</td><td class="mono">${r.order}</td><td>${esc(r.sup)}</td><td><span class="badge ${/^NCC/.test(r.method)?'b-blue':'b-violet'}">${esc(r.method)}</span></td>
      <td>${esc(r.dest)} <span class="mut sm">(${r.pts} điểm)</span></td><td>${r.pick}</td><td class="tc">${r.prio==='urgent'?'<span class="badge b-red"><i class="ri-flashlight-line"></i>Gấp</span>':'<span class="mut sm">Thường</span>'}</td>
      <td>${esc(r.by)}</td><td>${r.owner?esc(r.owner):'<span class="mut">—</span>'}</td><td class="tc">${badge(r.status)}${r.diff?' <span class="badge b-amber">Chênh lệch</span>':''}</td><td class="tc" style="white-space:nowrap">${act}</td></tr>`;
  }).join('') : `<tr><td colspan="13" class="tc mut" style="padding:16px">Không có phiếu.</td></tr>`;
  return `<div class="sec">
    <div class="sec-h"><h6>Danh sách phiếu giao hàng</h6><span class="sp"></span>
      <input class="v2-input" style="width:280px;height:30px" placeholder="Tìm mã phiếu, đơn mua, NCC, điểm giao…">
      <select class="v2-input" style="width:180px;height:30px"><option>Người phụ trách</option>${TEAM.map(d=>`<option>${d.name}</option>`).join('')}</select>
      <input type="date" class="v2-input" style="width:150px;height:30px" title="Ngày lấy hàng">
    </div>
    <div class="sec-b">
      <div class="ftabs mb-2">${ITABS.map(t=>`<button class="ftab ${S.inboxTab===t[0]?'active':''}" onclick="S.inboxTab='${t[0]}';render()">${t[1]} <span class="badge b-gray">${all.filter(t[2]).length}</span></button>`).join('')}</div>
      <div class="tbl-wrap"><table class="pt"><thead><tr><th>STT</th><th>Mã phiếu</th><th>Đơn mua</th><th>NCC</th><th>Hình thức</th><th>Điểm giao</th><th>Ngày lấy hàng</th><th>Ưu tiên</th><th>Người gửi</th><th>Người phụ trách</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${body}</tbody></table></div>
      <div class="hint mt-2"><i class="ri-information-line"></i> Dòng nền xanh = phiếu của demo (thao tác được). Đổi "Đăng nhập với" ở trên để xem góc nhìn từng thành viên.</div>
    </div></div>`;
}
function receivePgh(){
  const p=cur(), me=meObj();
  modal({title:'Tiếp nhận phiếu giao hàng', icon:'ri-hand-heart-line', ok:'Tiếp nhận',
    body:`<b>${me.name}</b> tiếp nhận <b>${p.code}</b> và trở thành <b>người phụ trách</b>.<br>• ${isNcc()?shipLabel():`Lấy hàng tại ${SUPPLIER.name}`} — ngày lấy hàng ${dmy(p.pickupDate)}<br>• ${p.pts.length} điểm giao${p.prio==='urgent'?' — <b style="color:#b45309">GẤP</b>':''}<br><br><span class="mut">Phiếu biến mất khỏi tab "Chờ tiếp nhận" của người khác. ${U.supply} (Cung ứng) nhận thông báo.</span>`,
    onOk:()=>{ p.status=4; p.owner=me.name; p.receivedAt=tick(8); if (isNcc()) initDlv(p, p.pickupDate); p.history.push({at:p.receivedAt, who:me.name, t:'Tiếp nhận — người phụ trách: '+me.name});
      S.tab='progress'; go('pgh'); toast(`<i class="ri-notification-3-line"></i> ${U.supply} nhận thông báo: "${me.name} đã tiếp nhận ${p.code}".`); }});
}
function returnPgh(){

      p.status=3; p.returnReason=r; p.returnBy=me.name; p.history.push({at:tick(9), who:me.name, t:'Trả lại cung ứng: '+r, k:'bad'});
      go('order'); toast(`Đã trả lại ${p.code}. ${p.sentBy} nhận thông báo; SL nhả về đơn mua. (Đang xem với vai Cung ứng)`); }});
}

function pghInfo(p){
  return `<div class="kv">
    <div><div class="k">Đơn mua · NCC</div><div class="v"><span class="lnk" onclick="go('order')">DMH-0158/2026</span> · ${SUPPLIER.name}</div></div>
    <div><div class="k">Hình thức vận chuyển</div><div class="v">${shipLabel()}</div></div>
    <div><div class="k">Ngày lấy hàng</div><div class="v">${dmy(p.pickupDate)} ${p.prio==='urgent'?'<span class="badge b-red"><i class="ri-flashlight-line"></i>Gấp</span>':''}</div></div>

function routeAndGoods(p){
  const stops = `<div class="route"><div class="stop pick"><div class="sh"><span class="sn">${isNcc()?'NCC TỰ CHỞ':'LẤY HÀNG'}</span><span class="nm">${SUPPLIER.name}</span></div><div class="ad">${isNcc()?'<b>NCC tự vận chuyển tới điểm giao</b><br>':''}<i class="ri-map-pin-line"></i> ${SUPPLIER.address}<br><i class="ri-user-line"></i> ${SUPPLIER.contact} · ${SUPPLIER.phone}<br><i class="ri-time-line"></i> ${SUPPLIER.hours}</div></div>
    ${p.pts.map((pid,i)=>{ const pt=pointById(pid), pi=p.pinfo[pid]; return `<div class="arrow"><i class="ri-arrow-right-line"></i></div><div class="stop"><div class="sh"><span class="sn">ĐIỂM ${i+1}</span><span class="nm">${esc(pt.name)}</span></div><div class="ad"><i class="ri-map-pin-line"></i> ${esc(pt.address)}<br><i class="ri-user-line"></i> ${esc(pi.receiver)} · ${esc(pi.phone)}<br><i class="ri-time-line"></i> ${esc(pi.window)}${pt.sale?`<br><i class="ri-file-text-line"></i> HĐ bán ${pt.sale}`:''}</div></div>`; }).join('')}</div>`;
  let rows='';
  p.pts.forEach((pid,i)=>{ rows += `<tr class="grp"><td colspan="5">Điểm ${i+1}: ${esc(pointById(pid).name)}</td></tr>`;
    linesOf(pid).filter(l=>planQty(p,l.id)>0).forEach(l=>{ rows += `<tr><td class="mono">${l.code}</td><td class="cell-name"><b>${esc(l.name)}</b></td><td class="tc">${l.unit}</td><td class="tr">${fmt(planQty(p,l.id))}</td><td class="tc">${l.cold?'<span class="badge b-cyan"><i class="ri-snowflake-line"></i>2–8°C</span>':''}${l.fragile?'<span class="badge b-amber">Dễ vỡ</span>':''}</td></tr>`; }); });
  return `<div class="sec"><div class="sec-h"><h6>Lộ trình & hàng hóa</h6></div><div class="sec-b">${stops}<div class="tbl-wrap mt-3"><table class="pt"><thead><tr><th>Mã</th><th style="min-width:240px">Tên hàng</th><th>ĐVT</th><th>${isNcc()?'SL NCC giao':'SL cần lấy'}</th><th>Bảo quản</th></tr></thead><tbody>${rows}</tbody></table></div></div></div>`;
}
function vPgh(){
  const p=cur(); if(!p) return '';
  const me=meObj(), edit = p.status===4 && p.owner===me.name;
  const head = `<div class="sec"><div class="sec-h"><h6>Phiếu giao hàng <span class="mono">${p.code}</span></h6>${badge(p.status)}<span class="sp"></span><button class="btn btn-secondary" onclick="go('inbox')"><i class="ri-arrow-left-line"></i>Danh sách</button></div><div class="sec-b">${pghInfo(p)}</div></div>`;
  if (p.status===2 || p.status===3){
    return `${head}${p.status===3?`<div class="note note-err mb-2"><i class="ri-arrow-go-back-line"></i><div>Đã trả lại cung ứng: “${esc(p.returnReason)}” — chờ cung ứng sửa & gửi lại.</div></div>`:''}${routeAndGoods(p)}
      ${p.status===2?`<div class="form-footer"><div class="left"><i class="ri-information-line"></i> Tiếp nhận = bạn là người phụ trách. Không nhận được thì Trả lại (bắt buộc lý do).</div>
        <button class="btn btn-danger-o" onclick="returnPgh()"><i class="ri-arrow-go-back-line"></i>Trả lại cung ứng</button>
        <button class="btn btn-primary" onclick="receivePgh()"><i class="ri-hand-heart-line"></i>Tiếp nhận</button></div>`:''}`;
  }
  return `${head}
    ${p.status===4 && !edit?`<div class="note note-warn mb-2"><i class="ri-eye-line"></i><div>Người phụ trách là <b>${esc(p.owner)}</b> — bạn (${esc(me.name)}) chỉ xem. Đổi "Đăng nhập với" thành ${esc(p.owner)} để cập nhật.</div></div>`:''}
    <div class="sec"><div class="sec-h"><h6>Tiến độ giao hàng</h6></div><div class="sec-b">${tabProgress(p,edit)}</div></div>
    <div class="sec"><div class="sec-h"><h6>Chi phí</h6></div><div class="sec-b">${tabCost(p,edit)}</div></div>
    ${edit?`<div class="form-footer"><button class="btn btn-primary" onclick="finishPgh()"><i class="ri-flag-line"></i>Hoàn thành giao hàng</button></div>`:''}`;
}
function checks(p){
  const nd = p.pts.filter(id=>p.dlv[id]&&p.dlv[id].done).length;
  const badCost = p.costs.filter(c=>!c.type || !(+c.amount>0)).length;
  const costOk = p.costs.length ? !badCost : p.noCost;
  return [
    ...(isNcc() ? [] : [{ok:p.pickup.done, t:'Đã lấy hàng tại NCC', tab:'progress'}]),
    {ok:nd===p.pts.length, t:`${isNcc()?'Đã nhận hàng ở':'Đã giao'} ${nd}/${p.pts.length} điểm`, tab:'progress'},
    {ok:costOk, t: p.costs.length ? `Chi phí: ${p.costs.length} khoản · ${fmt(costTotal(p))}đ${badCost?` — <b>${badCost} dòng thiếu loại / số tiền</b>`:''}` : (p.noCost?'Không phát sinh chi phí':'Khai chi phí (hoặc tick "Không phát sinh chi phí")'), tab:'cost'},
  ];
}

      ${ls.map(l=>{ const v=pk.actual[l.id]!=null?pk.actual[l.id]:planQty(p,l.id); pk.actual[l.id]=v; return `<tr><td class="mono">${l.code}</td><td class="cell-name"><b>${esc(l.name)}</b></td><td class="tc">${l.unit}</td><td class="sm">${esc(pointById(pointOf(l)).name)}</td><td class="tr">${fmt(planQty(p,l.id))}</td><td class="tc"><input class="inp ${v>planQty(p,l.id)||v<0?'over':''}" type="number" min="0" value="${v}" oninput="setPk(${l.id},this)"></td></tr>`; }).join('')}</tbody></table></div>
      <div class="grid mt-2">

    else if (d.done){
      inner = `<div class="tbl-wrap"><table class="pt"><thead><tr><th>Mã</th><th style="min-width:220px">Tên hàng</th><th>ĐVT</th>${ncc?'<th>SL yêu cầu</th><th>Thực nhận</th><th>Thiếu</th>':'<th>Đã lấy</th><th>Thực giao</th><th>Mang về kho</th>'}</tr></thead><tbody>
        ${pls.map(l=>{ const a=capQty(p,l.id), b=dlvQty(p,l.id); return `<tr><td class="mono">${l.code}</td><td class="cell-name"><b>${esc(l.name)}</b></td><td class="tc">${l.unit}</td><td class="tr">${fmt(a)}</td><td class="tr ${b<a?'qneg':''}">${fmt(b)}</td><td class="tr">${a-b>0?`<span class="badge b-amber">${fmt(a-b)}</span>`:'—'}</td></tr>`; }).join('')}</tbody></table></div>
        <div class="sm mt-2">${ncc?'Nhận':'Giao'} lúc <b>${d.at}</b>${isKho(pid)?'':` · Người ký nhận: <b>${esc(d.signer)}</b>`}${d.issue?` · <span class="qneg">${esc(d.issue)}${d.note?': '+esc(d.note):''}</span>`:''}</div>`;
    } else if (edit){
      const short = pls.some(l=>(+d.actual[l.id]||0)<capQty(p,l.id));
      inner = `<div class="tbl-wrap"><table class="pt"><thead><tr><th>Mã</th><th style="min-width:220px">Tên hàng</th><th>ĐVT</th><th>${ncc?'SL yêu cầu':'Đã lấy'}</th><th>${ncc?'SL thực nhận':'SL thực giao'} <span class="req">*</span></th></tr></thead><tbody>
        ${pls.map(l=>{ const a=capQty(p,l.id), v=d.actual[l.id]; return `<tr><td class="mono">${l.code}</td><td class="cell-name"><b>${esc(l.name)}</b></td><td class="tc">${l.unit}</td><td class="tr">${fmt(a)}</td><td class="tc"><input class="inp ${v>a||v<0?'over':''}" type="number" min="0" value="${v}" oninput="setDlv('${pid}',${l.id},this)"></td></tr>`; }).join('')}</tbody></table></div>
        <div class="grid mt-2">
          ${isKho(pid)?'':`<div><div class="v2-label">Người ký nhận <span class="req">*</span></div><input class="v2-input ${E['sg_'+pid]?'err':''}" value="${esc(d.signer)}" oninput="cur().dlv['${pid}'].signer=this.value">${E['sg_'+pid]?`<div class="err-tx"><i class="ri-error-warning-line"></i>${E['sg_'+pid]}</div>`:''}</div>`}
          <div><div class="v2-label">Thời gian ${ncc?'nhận':'giao'} <span class="req">*</span></div><div class="fwa"><input type="date" class="v2-input" value="${d.date}" onchange="cur().dlv['${pid}'].date=this.value"><input type="time" class="v2-input" style="max-width:110px" value="${d.time}" onchange="cur().dlv['${pid}'].time=this.value"></div></div>
          <div class="s3" id="iss_${pid}" style="${short?'':'display:none'}"><div class="fwa"><div style="flex:0 0 280px"><div class="v2-label">Lý do ${ncc?'nhận thiếu':'giao thiếu'} <span class="req">*</span></div><select class="v2-input ${E['iss_'+pid]?'err':''}" onchange="cur().dlv['${pid}'].issue=this.value">${['',...ISSUES].map(x=>`<option value="${x}" ${x===d.issue?'selected':''}>${x||'Chọn lý do'}</option>`).join('')}</select>${E['iss_'+pid]?`<div class="err-tx"><i class="ri-error-warning-line"></i>${E['iss_'+pid]}</div>`:''}</div>
            <div style="flex:1"><div class="v2-label">Mô tả</div><input class="v2-input" value="${esc(d.note)}" placeholder="${ncc?'VD: NCC hẹn giao bù 31/10 / hàng lỗi trả lại NCC':'Hàng chưa giao được sẽ mang về kho'}" oninput="cur().dlv['${pid}'].note=this.value"></div></div></div>
        </div>
        <div class="tr mt-2"><button class="btn btn-primary" onclick="confirmPoint('${pid}')"><i class="ri-checkbox-circle-line"></i>${ncc?(isKho(pid)?'Xác nhận kho đã nhận hàng':'Xác nhận khách đã nhận hàng'):(isKho(pid)?'Xác nhận đã bàn giao kho':'Xác nhận đã giao điểm này')}</button></div>`;
    } else inner = `<div class="sm mut">${ncc?'Chưa nhận.':'Chưa giao.'}</div>`;
    return `<div class="step ${d&&d.done?'done':''} ${ncc||pk.done?'':'lockc'}"><div class="step-h"><span class="badge b-blue">ĐIỂM ${i+1}</span><span class="nm">${esc(pt.name)}</span><span class="sm mut">${esc(pi.receiver)} · ${esc(pi.phone)} · ${esc(pi.window)}</span><span class="sp"></span>
      ${d&&d.done?`<span class="badge ${d.issue?'b-amber':'b-green'}"><i class="ri-check-line"></i>${d.issue?(ncc?'Nhận thiếu':'Giao thiếu'):(ncc?'Đã nhận':'Đã giao')}</span>${edit?` <button class="btn btn-tertiary btn-sm" onclick="cur().dlv['${pid}'].done=false;render()"><i class="ri-edit-line"></i>Sửa</button>`:''}`:`<span class="badge b-gray">${ncc?'Chưa nhận':'Chưa giao'}</span>`}</div>
      <div class="step-b"><div class="sm mut mb-2"><i class="ri-map-pin-line"></i> ${esc(pt.address)}</div>${inner}</div></div>`;
  }).join('');
  return ncc ? ptCards : pkCard + ptCards;
}
function setPk(lid, el){ const p=cur(), v=Math.floor(+el.value||0); p.pickup.actual[lid]=v; el.classList.toggle('over', v>planQty(p,lid)||v<0); }
function confirmPickup(){
  const p=cur(), pk=p.pickup, E={}, ls=LINES.filter(l=>planQty(p,l.id)>0);
  if (ls.some(l=>pk.actual[l.id]>planQty(p,l.id) || pk.actual[l.id]<0)) E.pk='SL thực lấy không được vượt SL yêu cầu.';
  else if (ls.every(l=>!pk.actual[l.id])) E.pk='Chưa lấy được hàng nào — trao đổi với cung ứng để dời / hủy.';
  if (ls.some(l=>pk.actual[l.id]<planQty(p,l.id)) && !pk.note.trim()) E.pkNote='Lấy thiếu — ghi lý do (cung ứng nhận thông báo).';
  S.err=E; if (Object.keys(E).length) return render();
  setClock(pk.date, pk.time); pk.done=true; pk.at=`${dmy(pk.date)} ${pk.time}`;
  initDlv(p, pk.date);
  const short = ls.filter(l=>pickedQty(p,l.id)<planQty(p,l.id));
  p.history.push({at:pk.at, who:p.owner, t:'Đã lấy hàng tại NCC'+(short.length?` — thiếu ${short.length} mặt hàng: ${pk.note}`:''), k:short.length?'warn':''});
  render(); toast(short.length?`<i class="ri-error-warning-line"></i> Lấy thiếu ${short.length} mặt hàng — ${U.supply} nhận thông báo để làm việc với NCC.`:'Đã xác nhận lấy đủ hàng tại NCC.');
}
// Khởi tạo xác nhận từng điểm: tự lấy → sau khi lấy hàng; NCC giao → ngay khi tiếp nhận
function initDlv(p, date){
  p.pts.forEach((pid,i)=>{ const d={done:false, actual:{}, signer:isKho(pid)?'':p.pinfo[pid].receiver, issue:'', note:'', date, time:['10:30','13:30','15:00'][i]||'16:00'};
    linesOf(pid).forEach(l=>{ if (planQty(p,l.id)>0) d.actual[l.id]=capQty(p,l.id); }); p.dlv[pid]=d; });
}
function setDlv(pid, lid, el){
  const p=cur(), d=p.dlv[pid]; d.actual[lid]=Math.floor(+el.value||0);
  el.classList.toggle('over', d.actual[lid]>capQty(p,lid) || d.actual[lid]<0);
  $('#iss_'+pid).style.display = linesOf(pid).filter(l=>planQty(p,l.id)>0).some(l=>(+d.actual[l.id]||0)<capQty(p,l.id)) ? '' : 'none';
}
function confirmPoint(pid){
  const p=cur(), d=p.dlv[pid], E={}, ls=linesOf(pid).filter(l=>planQty(p,l.id)>0);
  const short = ls.some(l=>d.actual[l.id]<capQty(p,l.id));
  if (ls.some(l=>d.actual[l.id]>capQty(p,l.id) || d.actual[l.id]<0)) E['iss_'+pid]=isNcc()?'SL thực nhận không vượt SL yêu cầu.':'SL giao không vượt SL đã lấy.';
  else if (short && !d.issue) E['iss_'+pid]='Chọn lý do giao thiếu';
  if (!short) d.issue='';
  if (!isKho(pid) && !String(d.signer).trim()) E['sg_'+pid]='Nhập người ký nhận';
  S.err=E; if (Object.keys(E).length){ render(); if (E['iss_'+pid]) $('#iss_'+pid).style.display=''; return; }
  setClock(d.date, d.time); d.done=true; d.at=`${dmy(d.date)} ${d.time}`;
  p.history.push({at:d.at, who:p.owner, t:`${isNcc()?'NCC đã giao':'Đã giao'} ${pointById(pid).name}`+(isKho(pid)?'':` — ký nhận ${d.signer}`)+(d.issue?` (${d.issue})`:''), k:d.issue?'warn':''});
  render(); toast(`Đã xác nhận ${isNcc()?'nhận hàng tại':'giao'} ${esc(pointById(pid).name)}.`);
}

/* --- Tab Chi phí --- */
function tabCost(p, edit){
  const D=edit?'':'disabled', tot=costTotal(p), sh=S.show;
  const rows = p.costs.map((c,i)=>{ const bad = sh && (!c.type || !(+c.amount>0));
    return `<tr class="${bad?'errrow':''}"><td class="tc">${i+1}</td>
      <td><select class="v2-input sm ${sh&&!c.type?'err':''}" ${D} onchange="setCostType(${i},this.value)">${['',...COST_TYPES].map(t=>`<option value="${t}" ${t===c.type?'selected':''}>${t||'Chọn loại chi phí'}</option>`).join('')}</select></td>
      <td><input class="v2-input sm" ${D} value="${esc(c.desc)}" placeholder="VD: Cao tốc Pháp Vân – Cầu Giẽ 2 lượt" oninput="cur().costs[${i}].desc=this.value"></td>
      <td><input class="v2-input sm tr ${sh&&!(+c.amount>0)?'err':''}" style="width:120px" ${D} value="${c.amount?fmt(c.amount):''}" placeholder="0" oninput="setCostAmt(${i},this)"></td>
      <td><select class="v2-input sm" ${D} onchange="cur().costs[${i}].payTo=this.value">${Object.entries(PAY_TO).map(([k,t])=>`<option value="${k}" ${k===c.payTo?'selected':''}>${t}</option>`).join('')}</select></td>
      <td>${c.files.map((f,fi)=>`<span class="file"><i class="ri-image-line"></i>${f}${edit?`<i class="ri-close-line x" onclick="cur().costs[${i}].files.splice(${fi},1);render()"></i>`:''}</span>`).join('')}${edit?`<button class="icon-btn" title="Tải hóa đơn / biên lai" onclick="addCostFile(${i})"><i class="ri-upload-2-line"></i></button>`:''}${!c.files.length&&!edit?'<span class="mut">—</span>':''}</td>
      <td class="tc">${edit?`<button class="icon-btn danger" title="Xóa" onclick="cur().costs.splice(${i},1);render()"><i class="ri-delete-bin-line"></i></button>`:''}</td></tr>`; }).join('');
  return `<div class="tbl-wrap"><table class="pt"><thead><tr><th>STT</th><th style="min-width:180px">Loại chi phí <span class="req">*</span></th><th style="min-width:220px">Diễn giải</th><th>Số tiền (VNĐ) <span class="req">*</span></th><th style="min-width:200px">Trả cho</th><th style="min-width:160px">Hóa đơn / biên lai</th><th></th></tr></thead>
      <tbody>${rows||`<tr><td colspan="7" class="tc mut" style="padding:14px">Chưa có khoản chi nào.</td></tr>`}
      <tr class="total"><td colspan="3" class="tr">Tổng chi phí thực tế</td><td class="tr" id="costTot">${fmt(tot)}</td><td colspan="3" id="costCmp">${cmpBadge(tot)}</td></tr></tbody></table></div>
    <div class="fwa mt-2">${edit?`<button class="btn btn-tertiary" onclick="addCost()"><i class="ri-add-line"></i>Thêm chi phí</button>`:''}
      ${!p.costs.length?`<label class="cb"><input type="checkbox" ${D} ${p.noCost?'checked':''} onchange="cur().noCost=this.checked;render()"> Chuyến này không phát sinh chi phí</label>`:''}</div>`;
}
function cmpBadge(tot){ if (!tot) return ''; const d=tot-estCost(); return d>0?`<span class="badge b-red">Vượt dự kiến ${fmt(d)}đ</span>`:`<span class="badge b-green">Trong dự kiến (còn ${fmt(-d)}đ)</span>`; }
function addCost(){ const p=cur(); p.costs.push({type:'', desc:'', amount:0, payTo:isNcc()?'ncc':'self', files:[]}); p.noCost=false; render(); }
function setCostType(i, v){ const c=cur().costs[i]; c.type=v; if (v===COST_TYPES[0]) c.payTo='vc'; render(); }
function setCostAmt(i, el){ const p=cur(), n=+el.value.replace(/[^0-9]/g,'')||0; p.costs[i].amount=n; el.value=n?fmt(n):''; $('#costTot').textContent=fmt(costTotal(p)); $('#costCmp').innerHTML=cmpBadge(costTotal(p)); }
function addCostFile(i){ cur().costs[i].files.push(`HD_CP_${fileSeq++}.jpg`); render(); }


/* --- Hoàn thành --- */
function finishPgh(){
  const p=cur(), ck=checks(p);
  if (!ck.every(c=>c.ok)){ S.show=true; render(); return toast('<i class="ri-error-warning-line"></i> Chưa đủ điều kiện hoàn thành: '+ck.filter(c=>!c.ok).map(c=>c.t.replace(/<[^>]+>/g,'')).join(' · ')); }
  const ls=LINES.filter(l=>planQty(p,l.id)>0);
  const diff = ls.some(l=>dlvQty(p,l.id)<planQty(p,l.id)), tot=costTotal(p);
  modal({title:'Hoàn thành giao hàng', icon:'ri-flag-line', ok:'Hoàn thành',
    body:`Hoàn thành <b>${p.code}</b>?<br>• Chi phí thực tế <b>${fmt(tot)}đ</b> (dự kiến ${fmt(estCost())}đ).
      ${diff?`<div class="note note-warn mt-2"><i class="ri-error-warning-line"></i><div>Có chênh lệch so với yêu cầu.</div></div>`:''}
      <div class="mut mt-2">Sau khi hoàn thành không sửa được tiến độ / chi phí.</div>`,
    onOk:()=>{ p.status=5; p.diff=diff; p.doneAt=tick(30);
      p.history.push({at:p.doneAt, who:p.owner, t:'Hoàn thành giao hàng'+(diff?' — có chênh lệch':''), k:diff?'warn':''});
      render(); toast(`<i class="ri-checkbox-circle-line"></i> ${p.code} đã hoàn thành.`); }});
}

/* ======================= Quy tắc ======================= */
function vRules(){
  return `<div class="sec rules"><div class="sec-h"><h6>Quy tắc nghiệp vụ (đề xuất)</h6><span class="sp"></span><button class="btn btn-secondary" onclick="go('order')"><i class="ri-arrow-left-line"></i>Về demo</button></div><div class="sec-b">
  <h4>1. Gửi bộ phận giao hàng (Cung ứng)</h4><ul>
    <li>Đơn mua <b>Đã duyệt</b>, <b>mọi hình thức vận chuyển</b> đều gửi BP giao hàng: <i>NCC giao về kho</i>, <i>NCC giao thẳng KH</i>, <i>Cty tự lấy → về kho / giao KH</i>.</li>
    <li>Bấm <b>Gửi bộ phận giao hàng</b>: nhập ngày lấy hàng, ưu tiên, ghi chú → hệ thống tạo phiếu giao hàng với <b>toàn bộ SL còn phải gửi</b>, điểm giao + người nhận theo đơn mua. Không cần duyệt, không chọn người.</li>
    <li>Còn phải gửi = SL mua − Đã lấy (phiếu Hoàn thành) − Đang giao (phiếu Chờ tiếp nhận / Đang xử lý). Thiếu → "Gửi giao phần còn lại" tạo phiếu mới.</li></ul>
  <h4>2. Tiếp nhận (Bộ phận giao hàng)</h4><ul>
    <li>Mọi thành viên BP giao hàng nhận thông báo + thấy phiếu ở tab <b>Chờ tiếp nhận</b>. <b>Ai bấm Tiếp nhận trước → là người phụ trách</b>; phiếu chuyển Đang xử lý.</li>
    <li>Không nhận được → <b>Trả lại</b> (bắt buộc lý do), SL nhả về đơn mua; cung ứng sửa & gửi lại.</li>
</ul>
  <h4>3. Cập nhật (chỉ người phụ trách)</h4><ul>
    <li><b>Tiến độ</b>: xác nhận lấy hàng (thực lấy ≤ yêu cầu, thiếu → ghi chú); xác nhận từng điểm (thực giao ≤ thực lấy, thiếu → lý do; người ký nhận, thời gian).</li>
    <li><b>Tiến độ khi NCC giao</b>: không có bước lấy hàng. Người phụ trách có mặt nhận / bàn giao, xác nhận <b>thực nhận ≤ SL yêu cầu</b> từng điểm (thiếu → lý do); điểm kho chỉ ghi thời gian nhận, điểm khách hàng ghi thêm người ký nhận.</li>
    <li><b>Chi phí</b>: từng khoản (loại, diễn giải, số tiền, trả cho, hóa đơn / biên lai). So với chi phí dự kiến trên đơn mua. Không có chi phí → tick "Không phát sinh".</li>
    <li>Màn cập nhật 1 trang: Tiến độ giao hàng → Chi phí → nút Hoàn thành. Không có mục chứng từ (hóa đơn chi phí đính kèm theo từng khoản).</li></ul>
  <h4>4. Hoàn thành</h4><ul>
    <li>Điều kiện: đã lấy hàng (chỉ Cty tự lấy), giao / nhận hết điểm, chi phí hợp lệ (hoặc không phát sinh).</li>
    <li>Kết quả (tạm chưa demo): điểm giao đơn mua tự Đã giao / Giao một phần; lấy đủ → đơn mua Hoàn thành; chi phí → bảng Chi phí VC đơn mua (Thực tế), khoản tự chi → kế toán hoàn ứng; về kho → thủ kho lập phiếu nhập; lấy rồi chưa giao → mang về kho.</li></ul>
  </div></div>`;
}

render();
</script>
</body>
